name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GIT_LFS_SKIP_SMUDGE: "1"
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: List the regenerated files
        run: |
          mapfile -t files < <(jq -r '.[]' scripts/generated-files.json)
          test "${#files[@]}" -gt 0
          git add --intent-to-add -- "${files[@]}"
      - if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
        name: Check the regenerated files
        run: |
          mapfile -t files < <(jq -r '.[]' scripts/generated-files.json)
          git diff --exit-code -- "${files[@]}"
      - if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        name: Commit the regenerated files
        run: |
          mapfile -t files < <(jq -r '.[]' scripts/generated-files.json)
          if git diff --quiet -- "${files[@]}"; then exit 0; fi
          git diff --stat -- "${files[@]}"
          git diff --binary -- "${files[@]}" > "$RUNNER_TEMP/generated.patch"
          merge=$(git rev-parse HEAD)
          git reset --quiet --hard
          git clean -fdq -- "${files[@]}"
          git fetch --depth=1 origin "$SHA"
          git checkout --force -B "$BRANCH" "$SHA"
          git apply --index "$RUNNER_TEMP/generated.patch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: regenerate the files in scripts/generated-files.json"
          git push origin "HEAD:refs/heads/$BRANCH"
          gh workflow run ci.yml --ref "$BRANCH"
          echo "::notice::Pushed the regenerated files to $BRANCH as $(git rev-parse --short HEAD), CI runs again there"
          git checkout --force --detach "$merge"
        env:
          BRANCH: ${{ github.head_ref }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 1
      - if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: pnpm astro build
      - if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: dist-production
          path: dist/
          retention-days: 1
      - if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          url=$(pnpm --silent --package=netlify-cli@27.11.2 dlx netlify deploy --no-build --dir=dist --filter open-props-ui-docs --alias "pr-$PR" --message "PR #$PR ${SHA::7}" --json | jq -r .deploy_url)
          test -n "$url"
          test "$url" != null
          printf '<!-- preview -->\nPreview: %s (%s)\n' "$url" "${SHA::7}" > "$RUNNER_TEMP/preview.md"
          ids=$(gh api "repos/$GH_REPO/issues/$PR/comments" --paginate --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- preview -->") or startswith("Preview: "))) | .id')
          if [ -n "$ids" ]; then
            gh api --method PATCH "repos/$GH_REPO/issues/comments/$(printf '%s\n' "$ids" | head -n 1)" -F "body=@$RUNNER_TEMP/preview.md" > /dev/null
          else
            gh pr comment "$PR" --body-file "$RUNNER_TEMP/preview.md"
          fi
          echo "Preview: $url" >> "$GITHUB_STEP_SUMMARY"
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [check, e2e]
    runs-on: ubuntu-latest
    env:
      GIT_LFS_SKIP_SMUDGE: "1"
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v8
        with:
          name: dist-production
          path: dist
      - run: pnpm --package=netlify-cli@27.11.2 dlx netlify deploy --prod --no-build --dir=dist --filter open-props-ui-docs --message "Deploy ${GITHUB_SHA::7}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

  e2e:
    if: always()
    needs: e2e-shard
    runs-on: ubuntu-latest
    steps:
      - run: test "$RESULT" = success
        env:
          RESULT: ${{ needs.e2e-shard.result }}

  e2e-shard:
    name: e2e (${{ matrix.shard }}/3)
    needs: check
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - run: apt-get update && apt-get install --yes --no-install-recommends git-lfs
      - uses: actions/checkout@v7
      - name: List the visual baselines in Git LFS
        id: lfs
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git lfs install --local
          git lfs ls-files --long | cut -d ' ' -f 1 | sort > "$RUNNER_TEMP/lfs-objects"
          echo "objects=$(sha256sum < "$RUNNER_TEMP/lfs-objects" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v6
        id: lfs-cache
        with:
          key: lfs-${{ steps.lfs.outputs.objects }}
          path: .git/lfs/objects
          restore-keys: lfs-
      - name: Pull the visual baselines
        shell: bash
        run: |
          git lfs pull
          mkdir -p .git/lfs/objects
          find .git/lfs/objects -type f -printf '%f\n' | sort | comm -23 - "$RUNNER_TEMP/lfs-objects" > "$RUNNER_TEMP/lfs-stale"
          while read -r oid; do rm -f ".git/lfs/objects/${oid:0:2}/${oid:2:2}/$oid"; done < "$RUNNER_TEMP/lfs-stale"
      - uses: actions/cache/save@v6
        if: steps.lfs-cache.outputs.cache-hit != 'true'
        with:
          key: ${{ steps.lfs-cache.outputs.cache-primary-key }}
          path: .git/lfs/objects
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist-test
      - run: pnpm test:e2e --shard=${{ matrix.shard }}/3
        env:
          E2E_PREBUILT: "1"
          HOME: /root
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  history:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      BASE: origin/${{ github.base_ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
          ref: ${{ github.event.pull_request.head.sha }}
      - run: node scripts/check-ratchets.mjs "$BASE"
      - if: ${{ !cancelled() }}
        run: node scripts/check-screenshot-authors.mjs "$BASE"
