name: Diagnose engine failures

on:
  push:
    branches: [claude/eager-galileo-06mvxi]

jobs:
  diag:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    env:
      GIT_LFS_SKIP_SMUDGE: "1"
    steps:
      - uses: actions/checkout@v7
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:e2e:build
      - name: The failing tests, repeated
        run: pnpm exec playwright test tests/e2e/engines.spec.ts tests/e2e/docs.spec.ts tests/e2e/interaction.spec.ts --reporter=list --project=firefox --project=webkit --repeat-each=5 -g "end aligned|range shows its value again|shows focus on every Tab stop" || true
        env:
          E2E_PREBUILT: "1"
          HOME: /root
