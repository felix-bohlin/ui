name: Publish

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  apps:
    permissions:
      contents: read
    uses: ./.github/workflows/apps.yml

  reference:
    permissions:
      contents: read
    uses: ./.github/workflows/reference.yml

  publish:
    needs: [apps, reference]
    runs-on: ubuntu-latest
    environment: npm
    env:
      GIT_LFS_SKIP_SMUDGE: "1"
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: node scripts/release.mjs publish

  on-npm:
    if: startsWith(github.ref, 'refs/tags/')
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions: {}
    steps:
      - name: Wait until npm serves the version
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          until npm pack "opui-css@$VERSION" --prefer-online --pack-destination "$RUNNER_TEMP" > /dev/null 2>&1; do
            echo "npm doesn't serve opui-css@$VERSION yet, trying again in 30 seconds"
            sleep 30
          done
          echo "npm serves opui-css@$VERSION"

  published:
    if: startsWith(github.ref, 'refs/tags/')
    needs: on-npm
    permissions:
      contents: read
    uses: ./.github/workflows/apps.yml
    with:
      version: ${{ github.ref_name }}

  published-reference:
    if: startsWith(github.ref, 'refs/tags/')
    needs: on-npm
    permissions:
      contents: read
    uses: ./.github/workflows/reference.yml
    with:
      version: ${{ github.ref_name }}
