name: Publish

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  apps:
    permissions:
      contents: read
    uses: ./.github/workflows/apps.yml

  publish:
    needs: apps
    runs-on: ubuntu-latest
    environment: npm
    env:
      GIT_LFS_SKIP_SMUDGE: "1"
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: node scripts/release.mjs publish

  published:
    if: startsWith(github.ref, 'refs/tags/')
    needs: publish
    permissions:
      contents: read
    uses: ./.github/workflows/apps.yml
    with:
      version: ${{ github.ref_name }}
