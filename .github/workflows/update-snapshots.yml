name: Update visual snapshots

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    if: github.event_name == 'workflow_dispatch' || (github.event.label.name == 'update-snapshots' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:e2e:update tests/e2e/visual.spec.ts
        env:
          HOME: /root
      - name: Commit updated snapshots
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/__screenshots__
          if git diff --cached --quiet; then
            echo "No snapshot changes"
          else
            git commit -m "chore: update visual snapshots"
            git push
          fi

  remove-label:
    needs: update
    if: always() && github.event_name == 'pull_request' && github.event.label.name == 'update-snapshots'
    runs-on: ubuntu-latest
    steps:
      - run: gh pr edit "${{ github.event.pull_request.number }}" --remove-label update-snapshots
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
