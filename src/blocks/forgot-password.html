<style>
  .forgot-password {
    container-type: inline-size;
    margin-inline: auto;
    max-inline-size: 56rem;

    .forgot-password-grid {
      align-items: start;
      display: grid;
      gap: var(--size-4);
      grid-template-columns: minmax(0, 1fr);

      @container (inline-size >= 46rem) {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    .ui-card {
      padding-block: var(--size-3);
    }

    hgroup {
      text-align: center;
    }

    .ui-content {
      display: grid;
      gap: var(--size-4);
    }

    .forgot-password-icon {
      justify-self: center;
    }

    .forgot-password-submit {
      inline-size: 100%;
      justify-content: center;
    }

    .forgot-password-footer {
      font-size: var(--font-size-1);
      text-align: center;
    }

    .forgot-password-back {
      align-items: center;
      display: inline-flex;
      gap: var(--size-1);

      svg {
        block-size: var(--size-3);
        inline-size: var(--size-3);
      }
    }
  }
</style>

<div class="forgot-password">
  <div class="forgot-password-grid">
    <section
      aria-labelledby="forgot-password-heading"
      class="ui-card ui-outlined"
    >
      <div class="ui-content">
        <div class="ui-avatar ui-squircle forgot-password-icon">
          <svg
            aria-hidden="true"
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
          >
            <path
              fill="currentColor"
              d="M12.65 10A5.99 5.99 0 0 0 7 6c-3.31 0-6 2.69-6 6s2.69 6 6 6a5.99 5.99 0 0 0 5.65-4H17v4h4v-4h2v-4zM7 14c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2"
            ></path>
          </svg>
        </div>
        <hgroup>
          <h1 class="ui-h4" id="forgot-password-heading">
            Forgot your password?
          </h1>
          <p>Enter the email you signed up with and we'll send you a link.</p>
        </hgroup>
        <form class="ui-form" action="#">
          <div class="ui-field-group">
            <label class="ui-text-field">
              <span class="ui-label">Email</span>
              <span class="ui-field">
                <input
                  aria-describedby="forgot-password-email-hint"
                  autocomplete="email"
                  name="email"
                  placeholder="ada@example.com"
                  required
                  type="email"
                />
              </span>
              <span class="ui-end-text" id="forgot-password-email-hint"
                >The link is valid for 30 minutes.</span
              >
            </label>
            <button
              class="ui-button ui-filled forgot-password-submit"
              type="submit"
            >
              Send reset link
            </button>
          </div>
        </form>
        <p class="forgot-password-footer">
          <a
            class="ui-link forgot-password-back"
            href="#forgot-password-sign-in"
            ><svg
              aria-hidden="true"
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
            >
              <path
                fill="currentColor"
                d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20z"
              ></path></svg
            >Back to sign in</a
          >
        </p>
      </div>
    </section>

    <section
      aria-labelledby="forgot-password-sent-heading"
      class="ui-card ui-outlined"
    >
      <div class="ui-content">
        <div class="ui-avatar ui-squircle forgot-password-icon">
          <svg
            aria-hidden="true"
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
          >
            <path
              fill="currentColor"
              d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2m0 4-8 5-8-5V6l8 5 8-5z"
            ></path>
          </svg>
        </div>
        <hgroup>
          <h2 class="ui-h4" id="forgot-password-sent-heading">
            Check your email
          </h2>
          <p>
            We sent a reset link to <strong>ingrid.holm@example.com</strong>.
          </p>
        </hgroup>
        <article class="ui-callout ui-info">
          <svg
            aria-hidden="true"
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
          >
            <path
              fill="currentColor"
              d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2m1 15h-2v-6h2zm0-8h-2V7h2z"
            ></path>
          </svg>
          <div class="ui-content">
            Can't find it? Check your spam folder, or wait a minute before
            asking for a new one.
          </div>
        </article>
        <a
          class="ui-button ui-filled forgot-password-submit"
          href="#forgot-password-open-mail"
          >Open email app</a
        >
        <p class="forgot-password-footer">
          Didn't get it?
          <button class="ui-button ui-small" type="button">Resend link</button>
        </p>
      </div>
    </section>
  </div>
</div>
