<style>
  .testimonials {
    container-type: inline-size;
    display: grid;
    gap: var(--size-7);
    margin-inline: auto;
    max-inline-size: 72rem;

    .testimonials-intro {
      display: grid;
      gap: var(--size-4);
      justify-items: center;
      margin-inline: auto;
      max-inline-size: 40rem;
      text-align: center;

      h1 {
        text-wrap: balance;
      }
    }

    .testimonials-summary {
      align-items: center;
      display: flex;
      flex-wrap: wrap;
      font-size: var(--font-size-1);
      gap: var(--size-2);
      justify-content: center;
      margin: 0;
    }

    .testimonials-list {
      column-gap: var(--size-4);
      columns: 1;
      list-style-type: none;
      margin: 0;
      padding: 0;

      @container (inline-size >= 40rem) {
        columns: 2;
      }

      @container (inline-size >= 60rem) {
        columns: 3;
      }

      li {
        break-inside: avoid;
        padding-block-end: var(--size-4);
      }

      figure {
        margin: 0;
      }

      .ui-content {
        display: grid;
        gap: var(--size-3);
      }

      blockquote {
        margin: 0;

        p {
          margin: 0;
        }
      }
    }

    .testimonials-stars {
      color: var(--warning);
      display: flex;

      svg {
        block-size: var(--size-3);
        inline-size: auto;
      }

      .testimonials-star-empty {
        color: var(--border-color);
      }
    }

    .testimonials-author {
      align-items: center;
      display: flex;
      gap: var(--size-3);
      margin-block-start: var(--size-1);

      & > span:last-child {
        display: grid;
      }
    }

    .testimonials-name {
      font-weight: var(--font-weight-medium);
    }

    .testimonials-role {
      color: var(--text-muted);
      font-size: var(--font-size-0);
    }
  }
</style>
