<style>
  .testimonials {
    container-type: inline-size;

    .testimonials-intro h1 {
      text-wrap: balance;
    }

    .testimonials-list {
      column-gap: var(--ui-space-4);
      columns: 1;
      list-style-type: none;
      padding: 0;

      @container (inline-size >= 40rem) {
        columns: 2;
      }

      @container (inline-size >= 56rem) {
        columns: 3;
      }

      li {
        break-inside: avoid;
        padding-block-end: var(--ui-space-4);
      }

      .ui-content {
        display: grid;
        gap: var(--ui-space-3);
      }
    }

    .testimonials-name {
      font-weight: var(--ui-font-weight-medium);
    }
  }
</style>

<section
  class="testimonials ui-layout-container ui-layout-column ui-large"
  aria-labelledby="testimonials-heading"
>
  <div
    class="ui-layout-container ui-layout-column ui-align-center testimonials-intro"
    style="--_max-inline-size: 40rem; --_padding-inline: 0"
  >
    <hgroup class="ui-hgroup">
      <p>Customer stories</p>
      <h1 class="ui-h2" id="testimonials-heading">
        Teams ship calmer with Northwind
      </h1>
      <p>
        From five-person startups to global product orgs, here's what our
        customers say.
      </p>
    </hgroup>
    <p class="ui-layout-row ui-align-center">
      <meter
        class="ui-rating ui-small"
        aria-hidden="true"
        max="5"
        value="4.9"
      ></meter>
      <span><strong>4.9 out of 5</strong> from 2&nbsp;300+ reviews</span>
    </p>
  </div>

  <ul class="testimonials-list">
    <li>
      <figure class="ui-card ui-outlined">
        <div class="ui-content">
          <meter
            class="ui-rating ui-small"
            aria-label="Rated 5 out of 5"
            max="5"
            value="5"
          ></meter>
          <blockquote>
            <p>
              We replaced three tools with Northwind and our planning meeting
              went from 90 minutes to 25. The roadmap finally reflects what
              engineering is actually doing.
            </p>
          </blockquote>
          <figcaption class="ui-layout-media">
            <span class="ui-avatar" aria-hidden="true">SL</span>
            <div>
              <p class="testimonials-name">Sofia Lindqvist</p>
              <p class="ui-caption">Head of Product, Fjord Health</p>
            </div>
          </figcaption>
        </div>
      </figure>
    </li>
    <li>
      <figure class="ui-card ui-outlined">
        <div class="ui-content">
          <meter
            class="ui-rating ui-small"
            aria-label="Rated 5 out of 5"
            max="5"
            value="5"
          ></meter>
          <blockquote>
            <p>
              Setup took an afternoon. The Jira import kept every comment and
              attachment.
            </p>
          </blockquote>
          <figcaption class="ui-layout-media">
            <span class="ui-avatar" aria-hidden="true">DO</span>
            <div>
              <p class="testimonials-name">Daniel Okafor</p>
              <p class="ui-caption">Engineering Manager, Brightpath</p>
            </div>
          </figcaption>
        </div>
      </figure>
    </li>
    <li>
      <figure class="ui-card ui-outlined">
        <div class="ui-content">
          <meter
            class="ui-rating ui-small"
            aria-label="Rated 4 out of 5"
            max="5"
            value="4"
          ></meter>
          <blockquote>
            <p>
              The insights dashboard made our cycle time visible for the first
              time. I wish the mobile app had the same filters, but it's getting
              there.
            </p>
          </blockquote>
          <figcaption class="ui-layout-media">
            <span class="ui-avatar" aria-hidden="true">MT</span>
            <div>
              <p class="testimonials-name">Mei Tanaka</p>
              <p class="ui-caption">Staff Engineer, Kumo Labs</p>
            </div>
          </figcaption>
        </div>
      </figure>
    </li>
    <li>
      <figure class="ui-card ui-outlined">
        <div class="ui-content">
          <meter
            class="ui-rating ui-small"
            aria-label="Rated 5 out of 5"
            max="5"
            value="5"
          ></meter>
          <blockquote>
            <p>
              Our support team links customer requests straight to roadmap
              items. Closing the loop with customers is now a one-click job.
            </p>
          </blockquote>
          <figcaption class="ui-layout-media">
            <span class="ui-avatar" aria-hidden="true">JB</span>
            <div>
              <p class="testimonials-name">Jonas Berg</p>
              <p class="ui-caption">Customer Success Lead, Saltvik</p>
            </div>
          </figcaption>
        </div>
      </figure>
    </li>
    <li>
      <figure class="ui-card ui-outlined">
        <div class="ui-content">
          <meter
            class="ui-rating ui-small"
            aria-label="Rated 5 out of 5"
            max="5"
            value="5"
          ></meter>
          <blockquote>
            <p>Honestly the calmest tool we use. No noise, just the work.</p>
          </blockquote>
          <figcaption class="ui-layout-media">
            <span class="ui-avatar" aria-hidden="true">AD</span>
            <div>
              <p class="testimonials-name">Amara Diallo</p>
              <p class="ui-caption">Designer, Studio Nord</p>
            </div>
          </figcaption>
        </div>
      </figure>
    </li>
    <li>
      <figure class="ui-card ui-outlined">
        <div class="ui-content">
          <meter
            class="ui-rating ui-small"
            aria-label="Rated 5 out of 5"
            max="5"
            value="5"
          ></meter>
          <blockquote>
            <p>
              SSO, audit logs and EU hosting were must-haves for us. Northwind
              checked every box our security team had, without slowing anyone
              down.
            </p>
          </blockquote>
          <figcaption class="ui-layout-media">
            <span class="ui-avatar" aria-hidden="true">EJ</span>
            <div>
              <p class="testimonials-name">Erik Johansson</p>
              <p class="ui-caption">CTO, Ledger & Co</p>
            </div>
          </figcaption>
        </div>
      </figure>
    </li>
  </ul>
</section>
