<style>
  .testimonials {
    container-type: inline-size;

    .testimonials-intro {
      align-items: center;
      margin-inline: auto;
      max-inline-size: 40rem;
      text-align: center;

      h1 {
        text-wrap: balance;
      }
    }

    .testimonials-summary {
      --_justify-content: center;
    }

    .testimonials-list {
      column-gap: var(--ui-space-4);
      columns: 1;
      list-style-type: none;
      padding: 0;

      @container (inline-size >= 40rem) {
        columns: 2;
      }

      @container (inline-size >= 56rem) {
        columns: 3;
      }

      li {
        break-inside: avoid;
        padding-block-end: var(--ui-space-4);
      }

      .ui-content {
        display: grid;
        gap: var(--ui-space-3);
      }
    }

    .testimonials-stars {
      color: var(--ui-warning);
      display: flex;

      svg {
        block-size: var(--size-3);
        inline-size: auto;
      }

      .testimonials-star-empty {
        color: var(--ui-border-color);
      }
    }

    .testimonials-name {
      font-weight: var(--ui-font-weight-medium);
    }
  }
</style>
