<div class="ui-card ui-outlined" aria-label="Shipping questions" role="group">

        aria-hidden="true"
        class="ui-marker"

        height="24"
        viewBox="0 0 24 24"
      ></svg>

      <p>Two to four working days within the EU, and up to ten elsewhere.</p>
    </div>
  </details>
  <details class="ui-accordion">

      <svg
        aria-hidden="true"
        class="ui-marker"

    </div>
  </details>
  <details class="ui-accordion">
    <summary>
      What does shipping cost?
      <svg
        aria-hidden="true"
        class="ui-marker"
