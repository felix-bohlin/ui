<opui-callout
  class="ui-callout ui-info"
  id="callout-dismissible-1"
  role="article"
>
  <svg
    aria-hidden="true"
    xmlns="http://www.w3.org/2000/svg"
    width="32"
    height="32"
    viewBox="0 0 32 32"
  ></svg>
  <div class="ui-content">
    The new tab editor is on for everyone. Your drafts from the old one are in
    Settings.
  </div>
  <button
    class="ui-button ui-round ui-small"
    type="button"
    aria-label="Dismiss"
    command="--dismiss"
    commandfor="callout-dismissible-1"
  >
    <svg
      aria-hidden="true"
      xmlns="http://www.w3.org/2000/svg"
      width="32"
      height="32"
      viewBox="0 0 32 32"
    ></svg>
  </button>
</opui-callout>

<script type="module">
  import "opui-css/elements/callout.js"
</script>

<script type="module">
  document
    .querySelector("#callout-dismissible-1")
    ?.addEventListener("dismiss", (event) => {
      if (!confirm("Hide this message?")) event.preventDefault()
    })
</script>
