<form class="ui-form">
  <fieldset class="ui-fieldset">
    <legend>Add-ons</legend>
    <div class="ui-field-group ui-horizontal">
      <label class="ui-checkbox ui-card ui-spread">
        <input
          type="checkbox"
          name="checkbox-cards-end"
          checked
          value="support"
        />
        <span class="ui-label">Priority support</span>
        <span class="ui-end-text">€8 per month</span>
      </label>
      <label class="ui-checkbox ui-card ui-spread ui-elevated">
        <input type="checkbox" name="checkbox-cards-end" value="storage" />
        <span class="ui-label">Extra storage</span>
        <span class="ui-end-text">€4 per month</span>
      </label>
      <label class="ui-checkbox ui-card ui-spread ui-tonal">
        <input type="checkbox" name="checkbox-cards-end" value="audit-log" />
        <span class="ui-label">Audit log</span>
        <span class="ui-end-text">€6 per month</span>
      </label>
    </div>
  </fieldset>
  <fieldset class="ui-fieldset">
    <legend>Email reports</legend>
    <div class="ui-field-group ui-horizontal">
      <label class="ui-checkbox ui-card">
        <input
          type="checkbox"
          name="checkbox-cards-start"
          checked
          value="weekly"
        />
        <span class="ui-label">Weekly summary</span>
        <span class="ui-end-text">Every Monday morning.</span>
      </label>
      <label class="ui-checkbox ui-card ui-elevated">
        <input type="checkbox" name="checkbox-cards-start" value="usage" />
        <span class="ui-label">Usage alerts</span>
        <span class="ui-end-text">At 80% of your plan.</span>
      </label>
      <label class="ui-checkbox ui-card ui-tonal">
        <input type="checkbox" name="checkbox-cards-start" value="invoices" />
        <span class="ui-label">Invoices</span>
        <span class="ui-end-text">After each payment.</span>
      </label>
    </div>
  </fieldset>
</form>
