<fieldset class="ui-fieldset">
  <legend>Newsletter topics</legend>
  <div class="ui-field-group">
    <label class="ui-checkbox">
      <input type="checkbox" name="checkbox-binding" checked value="updates" />
      <span class="ui-label">Product updates</span>
    </label>
    <label class="ui-checkbox">
      <input type="checkbox" name="checkbox-binding" value="events" />
      <span class="ui-label">Events</span>
    </label>
    <label class="ui-checkbox">
      <input type="checkbox" name="checkbox-binding" value="offers" />
      <span class="ui-label">Offers</span>
    </label>
  </div>
</fieldset>
<p class="checkbox-binding-text">Selected: updates</p>
<button class="ui-button checkbox-binding-reset" type="button">Reset</button>

<script type="module">
  const text = document.querySelector(".checkbox-binding-text")
  const inputs = [...document.querySelectorAll('[name="checkbox-binding"]')]

  function update() {
    if (!text) return
    text.textContent = `Selected: ${
      inputs
        .filter((input) => input.checked)
        .map((input) => input.value)
        .join(", ") || "none"
    }`
  }

  inputs.forEach((input) => input.addEventListener("change", update))
  document
    .querySelector(".checkbox-binding-reset")
    ?.addEventListener("click", () => {
      inputs.forEach((input) => (input.checked = input.defaultChecked))
      update()
    })
</script>
