<opui-select-all class="ui-select-all">
  <table class="ui-table">
    <thead>
      <tr>
        <th>
          <label class="ui-checkbox">
            <input type="checkbox" data-select-all />
            <span class="ui-sr-only">Select all tabs</span>
          </label>
        </th>
        <th>File</th>
        <th>Size</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>
          <label class="ui-checkbox">
            <input
              type="checkbox"
              name="checkbox-hidden-label"
              checked
              value="invoice"
            />
            <span class="ui-sr-only">Select Setlist.pdf</span>
          </label>
        </td>
        <td>Setlist.pdf</td>
        <td>120 kB</td>
      </tr>
      <tr>
        <td>
          <label class="ui-checkbox">
            <input type="checkbox" name="checkbox-hidden-label" value="logo" />
            <span class="ui-sr-only">Select Band-logo.svg</span>
          </label>
        </td>
        <td>Band-logo.svg</td>
        <td>8 kB</td>
      </tr>
      <tr>
        <td>
          <label class="ui-checkbox">
            <input type="checkbox" name="checkbox-hidden-label" value="notes" />
            <span class="ui-sr-only">Select Slap-tabs.md</span>
          </label>
        </td>
        <td>Slap-tabs.md</td>
        <td>2 kB</td>
      </tr>
    </tbody>
  </table>
</opui-select-all>

<p>
  Notify me by
  <label class="ui-checkbox">
    <input
      type="checkbox"
      name="checkbox-hidden-label-notify"
      checked
      value="email"
    />
    <span class="ui-label">email</span>
  </label>
  and
  <label class="ui-checkbox">
    <input type="checkbox" name="checkbox-hidden-label-notify" value="sms" />
    <span class="ui-label">SMS</span> </label
  >.
</p>

<script type="module">
  import "opui-css/elements/select-all.js"
</script>
