<opui-select-all class="ui-select-all">
  <fieldset class="ui-fieldset">
    <legend>Notifications</legend>
    <div class="ui-field-group">
      <label class="ui-checkbox">
        <input type="checkbox" data-select-all />
        <span class="ui-label">All notifications</span>
      </label>
      <label class="ui-checkbox">
        <input
          type="checkbox"
          name="checkbox-indeterminate"
          checked
          value="email"
        />
        <span class="ui-label">Email</span>
      </label>
      <label class="ui-checkbox">
        <input type="checkbox" name="checkbox-indeterminate" value="push" />
        <span class="ui-label">Push</span>
      </label>
      <label class="ui-checkbox">
        <input type="checkbox" name="checkbox-indeterminate" value="sms" />
        <span class="ui-label">SMS</span>
      </label>
    </div>
  </fieldset>
</opui-select-all>

<script type="module">
  import "opui-css/elements/select-all.js"
</script>
