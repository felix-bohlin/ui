<opui-color-field class="ui-color-field">
  <div class="ui-text-field">
    <label
      class="ui-label"
      for="color-field-variants-1"
      id="color-field-variants-1-label"
      >Outlined</label
    >
    <span class="ui-field">
      <span class="ui-start">
        <button
          type="button"
          aria-label="Pick a color"
          command="toggle-popover"
          commandfor="color-field-variants-1-picker"
          class="ui-button ui-round"
        >
          <span class="ui-indicator"></span>
        </button>
      </span>
      <input
        autocomplete="off"
        spellcheck="false"
        value="oklch(0.65 0.18 30)"
        id="color-field-variants-1"
        type="text"
      />
    </span>
  </div>
  <div
    aria-labelledby="color-field-variants-1-label"
    class="ui-floating"
    id="color-field-variants-1-picker"
    popover="auto"
    role="dialog"
  >
    <label class="ui-range" for="color-field-variants-1-lightness">
      <span class="ui-label" id="color-field-variants-1-lightness-label"
        >Lightness</span
      >
      <output
        aria-live="off"
        class="ui-value"
        for="color-field-variants-1-lightness"
      ></output>
      <input
        aria-labelledby="color-field-variants-1-lightness-label"
        data-channel="L"
        id="color-field-variants-1-lightness"
        max="1"
        min="0"
        step="0.001"
        type="range"
      />
    </label>
    <label class="ui-range" for="color-field-variants-1-chroma">
      <span class="ui-label" id="color-field-variants-1-chroma-label"
        >Chroma</span
      >
      <output
        aria-live="off"
        class="ui-value"
        for="color-field-variants-1-chroma"
      ></output>
      <input
        aria-describedby="color-field-variants-1-gamut"
        aria-labelledby="color-field-variants-1-chroma-label"

        id="color-field-variants-1-chroma"
        max="0.37"
        min="0"
        step="0.001"
        type="range"
      />
    </label>
    <label class="ui-range" for="color-field-variants-1-hue">
      <span class="ui-label" id="color-field-variants-1-hue-label">Hue</span>

        aria-live="off"

        id="color-field-variants-1-hue"
        max="360"
        min="0"
        step="0.1"
        type="range"
      />
    </label>
    <p class="ui-description" id="color-field-variants-1-gamut"></p>
  </div>
</opui-color-field>
