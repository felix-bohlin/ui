<div class="ui-combobox">
  <span class="ui-label" id="combobox-variants-outlined-label">Outlined</span>
  <span class="ui-field">
    <button
      aria-labelledby="combobox-variants-outlined-label combobox-variants-outlined-list"
      command="toggle-popover"
      commandfor="combobox-variants-outlined-list"
      type="button"
    >
      <span class="ui-placeholder">Pick a fruit</span>
    </button>
    <div
      aria-labelledby="combobox-variants-outlined-label"
      class="ui-list"
      id="combobox-variants-outlined-list"
      popover
      role="radiogroup"
    >
      <label
        ><input
          name="variants-outlined"
          type="radio"
          value="apple"
        />Apple</label
      >
      <label
        ><input
          name="variants-outlined"
          type="radio"
          value="banana"
        />Banana</label
      >
      <label
        ><input
          name="variants-outlined"
          type="radio"
          value="cherry"
        />Cherry</label
      >
    </div>
  </span>
</div>
