<button
  type="button"
  commandfor="command-palette-1"
  command="show-modal"
  class="ui-button ui-outlined"
>
  Open command palette
</button>

<dialog
  id="command-palette-1"
  class="ui-dialog ui-elevated"
  aria-label="Command palette"
  closedby="any"
>
  <opui-command class="ui-command">
    <div class="ui-header">
      <svg aria-hidden="true" height="24" viewBox="0 0 24 24" width="24">
        <path
          d="M16.102 17.162a8 8 0 1 1 1.06-1.06l4.618 4.618a.75.75 0 1 1-1.06 1.06zM17.5 11a6.5 6.5 0 1 0-13 0a6.5 6.5 0 0 0 13 0"
          fill="currentColor"
        ></path>
      </svg>
      <input
        type="text"
        aria-label="Search commands"
        placeholder="Search commands"
      />
    </div>
    <div class="ui-content">
      <div class="ui-command-group">
        <p class="ui-label" id="command-palette-1-actions">Actions</p>
        <ul
          aria-labelledby="command-palette-1-actions"
          class="ui-list ui-transparent"
        >
          <li>
            <button
              type="button"
              command="close"
              commandfor="command-palette-1"
            >
              <div class="ui-text"><p>New file</p></div>
            </button>
          </li>
          <li>
            <button
              type="button"
              command="close"
              commandfor="command-palette-1"
            >
              <div class="ui-text"><p>New folder</p></div>
            </button>
          </li>
          <li>
            <button
              type="button"
              command="close"
              commandfor="command-palette-1"
            >
              <div class="ui-text"><p>Invite people</p></div>
            </button>
          </li>
        </ul>
      </div>
      <div class="ui-command-group">
        <p class="ui-label" id="command-palette-1-pages">Pages</p>
        <ul
          aria-labelledby="command-palette-1-pages"
          class="ui-list ui-transparent"
        >
          <li>
            <a href="#palette"
              ><div class="ui-text"><p>Dashboard</p></div></a
            >
          </li>
          <li>
            <a href="#palette"
              ><div class="ui-text"><p>Billing</p></div></a
            >
          </li>
          <li>
            <a href="#palette"
              ><div class="ui-text"><p>Settings</p></div></a
            >
          </li>
        </ul>
      </div>
    </div>
    <p role="status"></p>
  </opui-command>
</dialog>

<script type="module">
  import "opui-css/elements/command.js"
</script>
