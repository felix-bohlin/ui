<div
  class="ui-control-group ui-primary ui-filled"
  role="group"
  aria-label="Find an order"
>
  <div class="ui-text-field">
    <label class="ui-sr-only" for="control-group-fields-2"
      >Order number or customer name</label
    >
    <span class="ui-field">
      <input
        placeholder="Search orders"
        id="control-group-fields-2"
        type="search"
      />
    </span>
  </div>
  <button class="ui-button" type="button">Search</button>
</div>

<fieldset class="ui-fieldset">
  <legend>Price</legend>
  <div class="ui-field-group">
    <div class="ui-control-group" role="group">
      <div class="ui-select">
        <label class="ui-sr-only" for="control-group-fields-3">Currency</label>
        <span class="ui-field">
          <select id="control-group-fields-3" name="currency">
            <button>
              <selectedcontent></selectedcontent>
            </button>
            <div class="ui-list">
              <option value="eur">EUR</option>
              <option value="sek">SEK</option>
              <option value="usd">USD</option>
            </div>
          </select>
        </span>
      </div>
      <div class="ui-text-field">
        <label class="ui-sr-only" for="control-group-fields-4">Amount</label>
        <span class="ui-field">
          <input
            placeholder="0.00"
            id="control-group-fields-4"
            inputmode="decimal"
            name="amount"
            type="text"
          />
        </span>
      </div>
    </div>
  </div>
</fieldset>

<div
  class="ui-control-group ui-primary ui-filled"
  role="group"
  aria-label="Add to cart"
>
  <opui-number-field class="ui-number-field">
    <label class="ui-sr-only" for="control-group-fields-1">Quantity</label>
    <span class="ui-field">
      <span class="ui-start">
        <button
          class="ui-button ui-round"
          type="button"
          aria-controls="control-group-fields-1"
          aria-label="Decrease"
          command="--step-down"
          commandfor="control-group-fields-1"
        >
          <svg
            aria-hidden="true"
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
          >
            <path fill="currentColor" d="M19 13H5v-2h14z"></path>
          </svg>
        </button>
      </span>
      <input
        max="10"
        min="1"
        value="1"
        id="control-group-fields-1"
        name="quantity"
        type="number"
      />
      <span class="ui-end">
        <button
          class="ui-button ui-round"
          type="button"
          aria-controls="control-group-fields-1"
          aria-label="Increase"
          command="--step-up"
          commandfor="control-group-fields-1"
        >
          <svg
            aria-hidden="true"
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
          >
            <path
              fill="currentColor"
              d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6z"
            ></path>
          </svg>
        </button>
      </span>
    </span>
  </opui-number-field>
  <button class="ui-button" type="button">Add to cart</button>
</div>

<script type="module">
  import "opui-css/elements/number-field.js"
</script>
