<div
  class="ui-control-group ui-primary ui-filled"
  role="group"
  aria-label="Find a bassist"
>
  <label class="ui-text-field">
    <span class="ui-sr-only" id="control-group-fields-2-label"
      >Bassist name or handle</span
    >
    <span class="ui-field">
      <input
        placeholder="Search bassists"
        aria-labelledby="control-group-fields-2-label"
        type="search"
      />
    </span>
  </label>
  <button class="ui-button" type="button">Search</button>
</div>

<fieldset class="ui-fieldset">
  <legend>Price</legend>
  <div class="ui-field-group">
    <div class="ui-control-group" role="group">
      <label class="ui-select">
        <span class="ui-sr-only" id="control-group-fields-3-label"
          >Currency</span
        >
        <span class="ui-field">
          <select
            aria-labelledby="control-group-fields-3-label"
            name="currency"
          >
            <button>
              <selectedcontent></selectedcontent>
            </button>
            <div class="ui-list">
              <option value="eur">EUR</option>
              <option value="sek">SEK</option>
              <option value="usd">USD</option>
            </div>
          </select>
        </span>
      </label>
      <label class="ui-text-field">
        <span class="ui-sr-only" id="control-group-fields-4-label">Amount</span>
        <span class="ui-field">
          <input
            inputmode="decimal"
            placeholder="0.00"
            aria-labelledby="control-group-fields-4-label"
            name="amount"
            type="text"
          />
        </span>
      </label>
    </div>
  </div>
</fieldset>

<div
  class="ui-control-group ui-primary ui-filled"
  role="group"
  aria-label="Add to cart"
>
  <opui-number-field class="ui-number-field">
    <label class="ui-sr-only" for="control-group-fields-1">Quantity</label>
    <span class="ui-field">
      <span class="ui-start">
        <button
          class="ui-button ui-round"
          type="button"
          aria-controls="control-group-fields-1"
          aria-label="Decrease"
          command="--step-down"
          commandfor="control-group-fields-1"
        >
          <svg
            aria-hidden="true"
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
          ></svg>
        </button>
      </span>
      <input
        max="10"
        min="1"
        value="1"
        id="control-group-fields-1"
        name="quantity"
        type="number"
      />
      <span class="ui-end">
        <button
          class="ui-button ui-round"
          type="button"
          aria-controls="control-group-fields-1"
          aria-label="Increase"
          command="--step-up"
          commandfor="control-group-fields-1"
        >
          <svg
            aria-hidden="true"
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
          ></svg>
        </button>
      </span>
    </span>
  </opui-number-field>
  <button class="ui-button" type="button">Add to cart</button>
</div>

<script type="module">
  import "opui-css/elements/number-field.js"
</script>
