<div
  class="ui-control-group ui-primary ui-filled"
  role="group"
  aria-label="Find a bassist"
>
  <div class="ui-field">
    <label class="ui-sr-only" for="control-group-fields-2"
      >Bassist name or handle</label
    >
    <span class="ui-field-container">
      <input
        id="control-group-fields-2"
        placeholder="Search bassists"
        type="search"
      />
    </span>
  </div>
  <button class="ui-button" type="button">Search</button>
</div>

<fieldset class="ui-fieldset">
  <legend>Price</legend>
  <div class="ui-field-group">
    <div class="ui-control-group" role="group">
      <div class="ui-field">
        <label class="ui-sr-only" for="control-group-fields-4">Currency</label>
        <span class="ui-field-container">
          <select id="control-group-fields-4" name="currency">
            <button>
              <selectedcontent></selectedcontent>
            </button>
            <option value="eur">EUR</option>
            <option value="sek">SEK</option>
            <option value="usd">USD</option>
          </select>
        </span>
      </div>
      <div class="ui-field">
        <label class="ui-sr-only" for="control-group-fields-3">Amount</label>
        <span class="ui-field-container">
          <input
            id="control-group-fields-3"
            inputmode="decimal"
            name="amount"
            placeholder="0.00"
          />
        </span>
      </div>
    </div>
  </div>
</fieldset>

<div
  class="ui-control-group ui-primary ui-filled"
  role="group"
  aria-label="Add to cart"
>
  <opui-number-field class="ui-number-field">
    <label class="ui-sr-only" for="control-group-fields-1">Quantity</label>
    <span class="ui-field-container">
      <span class="ui-start">
        <button
          class="ui-button ui-round"
          type="button"
          aria-controls="control-group-fields-1"
          aria-label="Decrease"
          command="--step-down"
          commandfor="control-group-fields-1"
        >
          <svg
            aria-hidden="true"
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
          ></svg>
        </button>
      </span>
      <input
        id="control-group-fields-1"
        max="10"
        min="1"
        name="quantity"
        type="number"
        value="1"
      />
      <span class="ui-end">
        <button
          class="ui-button ui-round"
          type="button"
          aria-controls="control-group-fields-1"
          aria-label="Increase"
          command="--step-up"
          commandfor="control-group-fields-1"
        >
          <svg
            aria-hidden="true"
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
          ></svg>
        </button>
      </span>
    </span>
  </opui-number-field>
  <button class="ui-button" type="button">Add to cart</button>
</div>

<script type="module">
  import "opui-css/elements/number-field.js"
</script>
