<button
  class="ui-button ui-critical ui-outlined"
  type="button"
  command="show-modal"
  commandfor="dialog-alert-dialog-1"
>
  Delete project
</button>

<dialog
  aria-labelledby="dialog-alert-dialog-1-title"
  class="ui-dialog ui-elevated"
  aria-describedby="dialog-alert-dialog-1-description"
  id="dialog-alert-dialog-1"
  role="alertdialog"
>
  <div class="ui-header">
    <h2 id="dialog-alert-dialog-1-title">Delete project?</h2>
  </div>
  <div class="ui-content">
    <p id="dialog-alert-dialog-1-description">
      This deletes the project and all its files. You can't undo this.
    </p>
  </div>
  <div class="ui-footer">
    <button
      class="ui-button"
      type="button"
      command="close"
      commandfor="dialog-alert-dialog-1"
    >
      Cancel
    </button>
    <button
      class="ui-button ui-critical ui-filled"
      type="button"
      command="close"
      commandfor="dialog-alert-dialog-1"
    >
      Delete
    </button>
  </div>
</dialog>
