<button
  class="ui-button ui-outlined"
  type="button"
  command="show-modal"
  commandfor="dialog-close-button-1"
>
  Show release notes
</button>

<dialog
  aria-labelledby="dialog-close-button-1-title"
  class="ui-dialog ui-elevated"
  id="dialog-close-button-1"
>
  <div class="ui-header">
    <h2 id="dialog-close-button-1-title">Release notes</h2>
    <button
      class="ui-button ui-round ui-small"
      type="button"
      aria-label="Close"
      command="close"
      commandfor="dialog-close-button-1"
    >
      <svg
        aria-hidden="true"
        xmlns="http://www.w3.org/2000/svg"
        width="32"
        height="32"
        viewBox="0 0 32 32"
      ></svg>
    </button>
  </div>
  <div class="ui-content">
    <p>Version 2.4 adds shared folders and a faster search.</p>
  </div>
</dialog>
