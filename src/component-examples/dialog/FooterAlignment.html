<button
  type="button"
  commandfor="dialog-footer-alignment-1"
  command="show-modal"
  class="ui-button ui-outlined"
>
  Show shortcuts
</button>

<dialog
  aria-labelledby="dialog-footer-alignment-1-title"
  class="ui-dialog ui-elevated"
  id="dialog-footer-alignment-1"
>
  <div class="ui-header">
    <h2 id="dialog-footer-alignment-1-title">Keyboard shortcuts</h2>
  </div>
  <div class="ui-content">
    <p>
      Press
      <kbd>?</kbd>
      anywhere to open this list again.
    </p>
  </div>
  <div class="ui-footer ui-align-start">
    <button
      type="button"
      commandfor="dialog-footer-alignment-1"
      command="close"
      class="ui-button ui-filled"
    >
      Got it
    </button>
  </div>
</dialog>
