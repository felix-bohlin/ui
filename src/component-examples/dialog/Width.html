<button
  type="button"
  commandfor="dialog-width-1"
  command="show-modal"
  class="ui-button ui-outlined"
>
  Open wide dialog
</button>

<dialog
  id="dialog-width-1"
  class="ui-dialog ui-elevated"
  style="--_max-inline-size: 40rem"
  aria-labelledby="dialog-width-1-title"
>
  <div class="ui-header">
    <h2 id="dialog-width-1-title">Newsletter</h2>
  </div>
  <div class="ui-content">
    <p>
      Get a short email when we ship something new. No more than once a month.
    </p>
  </div>
  <div class="ui-footer">
    <button
      commandfor="dialog-width-1"
      command="close"
      class="ui-button"
      type="button"
    >
      Not now
    </button>
    <button
      commandfor="dialog-width-1"
      command="close"
      class="ui-button ui-filled"
      type="button"
    >
      Subscribe
    </button>
  </div>
</dialog>
