<button
  class="ui-button ui-outlined"
  type="button"
  command="show-modal"
  commandfor="drawer-close-button-1"
>
  Show filters
</button>

<dialog
  aria-labelledby="drawer-close-button-1-title"
  class="ui-drawer"
  closedby="any"
  id="drawer-close-button-1"
>
  <div class="ui-header">
    <h2 id="drawer-close-button-1-title">Filters</h2>
    <button
      class="ui-button ui-round ui-small"
      type="button"
      aria-label="Close"
      command="close"
      commandfor="drawer-close-button-1"
    >
      <svg
        aria-hidden="true"
        xmlns="http://www.w3.org/2000/svg"
        width="32"
        height="32"
        viewBox="0 0 32 32"
      ></svg>
    </button>
  </div>
  <div class="ui-content">
    <p>Narrow the list by status, owner and date.</p>
  </div>
</dialog>
