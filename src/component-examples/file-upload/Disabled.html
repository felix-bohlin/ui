<opui-file-upload class="ui-file-upload">
  <div class="ui-content">
    <div class="ui-field-container">
      <label class="ui-label">
        <input
          aria-describedby="file-upload-disabled-1-description"
          class="ui-sr-only"
          disabled
          id="file-upload-disabled-1"
          type="file"
        />
        <span class="ui-button ui-outlined">Choose photos</span>
        <svg
          aria-hidden="true"
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
        ></svg>
      </label>
      <span class="ui-description" id="file-upload-disabled-1-description"
        >Uploads open again on Monday.</span
      >
    </div>
  </div>
  <span class="ui-sr-only" role="status"></span>
</opui-file-upload>

<script type="module">
  import "opui-css/elements/file-upload.js"
</script>
