<opui-file-upload class="ui-file-upload">
  <div class="ui-content">
    <div class="ui-field-container">
      <label class="ui-label">
        <input
          accept="image/*"
          aria-describedby="file-upload-errors-1-description"
          class="ui-sr-only"
          id="file-upload-errors-1"
          multiple
          type="file"
        />
        <span class="ui-button ui-outlined">Choose photos</span>
        <svg
          aria-hidden="true"
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
        ></svg>
      </label>
      <span class="ui-description" id="file-upload-errors-1-description"
        >Or drop them here. PNG or JPG.</span
      >
    </div>
    <ul class="ui-list">
      <li>
        <div class="ui-start">
          <img alt="" src="/photos/kinga-headstock.png" />
        </div>
        <div class="ui-text">
          <p dir="auto" id="file-upload-errors-1-label-0">
            kinga-headstock.png
          </p>
        </div>
        <div class="ui-end">
          <button
            class="ui-button ui-round ui-small"
            type="button"
            aria-label="Remove kinga-headstock.png"
            command="--remove"
            commandfor="file-upload-errors-1"
            value="kinga"
          >
            <svg
              aria-hidden="true"
              xmlns="http://www.w3.org/2000/svg"
              width="32"
              height="32"
              viewBox="0 0 32 32"
            ></svg>
          </button>
        </div>
      </li>
      <li class="ui-state-error">
        <div class="ui-start">
          <img alt="" src="/photos/adam-groove.png" />
          <button
            aria-labelledby="file-upload-errors-1-label-1 file-upload-errors-1-description-1"
            popovertarget="file-upload-errors-1-description-1"
            type="button"
          ></button>
        </div>
        <div class="ui-text">
          <p dir="auto" id="file-upload-errors-1-label-1">adam-groove.png</p>
          <p
            class="ui-description"
            id="file-upload-errors-1-description-1"
            popover="auto"
          >
            The connection dropped. Remove it and choose it again.
          </p>
        </div>
        <div class="ui-end">
          <button
            class="ui-button ui-round ui-small"
            type="button"
            aria-label="Remove adam-groove.png"
            command="--remove"
            commandfor="file-upload-errors-1"
            value="adam"
          >
            <svg
              aria-hidden="true"
              xmlns="http://www.w3.org/2000/svg"
              width="32"
              height="32"
              viewBox="0 0 32 32"
            ></svg>
          </button>
        </div>
      </li>
    </ul>
  </div>
  <span class="ui-sr-only" role="status">1 photo didn't upload.</span>
</opui-file-upload>

<script type="module">
  import "opui-css/elements/file-upload.js"
</script>
