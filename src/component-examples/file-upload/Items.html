<opui-file-upload class="ui-file-upload">
  <div class="ui-content">
    <div class="ui-field-container">
      <label class="ui-label">
        <input
          accept="image/*"
          aria-describedby="file-upload-items-1-description"
          class="ui-sr-only"
          id="file-upload-items-1"
          multiple
          type="file"
        />
        <span class="ui-button ui-outlined">Choose photos</span>
        <svg
          aria-hidden="true"
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
        ></svg>
      </label>
      <span class="ui-description" id="file-upload-items-1-description"
        >Or drop them here. PNG or JPG.</span
      >
    </div>
    <ul class="ui-list">
      <li>
        <div class="ui-start">
          <img alt="" src="/photos/kinga-headstock.png" />
        </div>
        <div class="ui-text">
          <p dir="auto" id="file-upload-items-1-label-0">kinga-headstock.png</p>
        </div>
        <div class="ui-end">
          <button
            class="ui-button ui-round ui-small"
            type="button"
            aria-label="Remove kinga-headstock.png"
            command="--remove"
            commandfor="file-upload-items-1"
            value="kinga"
          >
            <svg
              aria-hidden="true"
              xmlns="http://www.w3.org/2000/svg"
              width="32"
              height="32"
              viewBox="0 0 32 32"
            ></svg>
          </button>
        </div>
      </li>
      <li>
        <div class="ui-start">
          <img alt="" src="/photos/adam-groove.png" />
        </div>
        <div class="ui-text">
          <p dir="auto" id="file-upload-items-1-label-1">adam-groove.png</p>
          <div class="ui-progress">
            <progress
              value="0.6"
              aria-label="Uploading adam-groove.png"
            ></progress>
          </div>
        </div>
        <div class="ui-end">
          <button
            class="ui-button ui-round ui-small"
            type="button"
            aria-label="Remove adam-groove.png"
            command="--remove"
            commandfor="file-upload-items-1"
            value="adam"
          >
            <svg
              aria-hidden="true"
              xmlns="http://www.w3.org/2000/svg"
              width="32"
              height="32"
              viewBox="0 0 32 32"
            ></svg>
          </button>
        </div>
      </li>
      <li>
        <div class="ui-start"></div>
        <div class="ui-text">
          <p dir="auto" id="file-upload-items-1-label-2">scott-humbucker.png</p>
          <div class="ui-progress">
            <progress aria-label="Uploading scott-humbucker.png"></progress>
          </div>
          <p class="ui-description" id="file-upload-items-1-description-2">
            Waiting for its turn
          </p>
        </div>
        <div class="ui-end">
          <button
            class="ui-button ui-round ui-small"
            type="button"
            aria-label="Remove scott-humbucker.png"
            command="--remove"
            commandfor="file-upload-items-1"
            value="scott"
          >
            <svg
              aria-hidden="true"
              xmlns="http://www.w3.org/2000/svg"
              width="32"
              height="32"
              viewBox="0 0 32 32"
            ></svg>
          </button>
        </div>
      </li>
    </ul>
  </div>
  <span class="ui-sr-only" role="status"></span>
</opui-file-upload>

<script type="module">
  import "opui-css/elements/file-upload.js"
</script>
