<form class="ui-form">
  <fieldset
    class="ui-fieldset"
    aria-describedby="form-field-group-1-description"
  >
    <legend>Plan</legend>
    <p class="ui-description" id="form-field-group-1-description">
      You can change your plan at any time.
    </p>
    <div class="ui-field-group">
      <label class="ui-radio">
        <input type="radio" name="plan" value="starter" />
        <span class="ui-label">Starter</span>
      </label>
      <label class="ui-radio">
        <input type="radio" name="plan" value="team" />
        <span class="ui-label">Team</span>
      </label>
      <label class="ui-radio">
        <input type="radio" name="plan" value="business" />
        <span class="ui-label">Business</span>
      </label>
    </div>
  </fieldset>
  <fieldset
    class="ui-fieldset"
    aria-describedby="form-field-group-2-description"
  >
    <legend>Add-ons</legend>
    <p class="ui-description" id="form-field-group-2-description">
      Billed monthly with your plan.
    </p>
    <div class="ui-field-group">
      <label class="ui-checkbox">
        <input type="checkbox" name="add-ons" value="backups" />
        <span class="ui-label">Backups</span>
        <span class="ui-end-text">Daily snapshots, kept for 30 days.</span>
      </label>
      <label class="ui-checkbox">
        <input type="checkbox" name="add-ons" value="encryption" />
        <span class="ui-label">Encryption</span>
        <span class="ui-end-text">Encrypt your files with your own keys.</span>
      </label>
      <label class="ui-checkbox">
        <input type="checkbox" name="add-ons" value="single-sign-on" />
        <span class="ui-label">Single sign-on</span>
        <span class="ui-end-text">Sign in with your company account.</span>
      </label>
    </div>
  </fieldset>
</form>
