<fieldset
  class="ui-fieldset"
  aria-describedby="form-fieldset-required-1-description"
>
  <legend>Delivery</legend>
  <p class="ui-description" id="form-fieldset-required-1-description">
    Where should we send your order?
  </p>
  <div class="ui-field-group">
    <label class="ui-text-field">
      <span class="ui-label">Recipient</span>
      <span class="ui-field">
        <input name="recipient" type="text" />
      </span>
    </label>
    <label class="ui-textarea">
      <span class="ui-label">Address</span>
      <span class="ui-field">
        <textarea required name="address"></textarea>
      </span>
    </label>
  </div>
</fieldset>
