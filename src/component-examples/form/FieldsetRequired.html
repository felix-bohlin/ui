<fieldset

  aria-describedby="form-fieldset-required-1-description"
>

  <p class="ui-description" id="form-fieldset-required-1-description">
    Where should we send your order?
  </p>
  <div class="ui-field-group">
    <div class="ui-text-field">
      <label class="ui-label" for="form-fieldset-required-2">Recipient</label>
      <span class="ui-field">
        <input id="form-fieldset-required-2" name="recipient" type="text" />
      </span>
    </div>
    <div class="ui-textarea">
      <label class="ui-label" for="form-fieldset-required-3">Address</label>
      <span class="ui-field">
        <textarea
          required
          id="form-fieldset-required-3"
          name="address"
        ></textarea>
      </span>
    </div>
  </div>
</fieldset>
