<form class="ui-form" id="form-kitchen-sink-1">
  <fieldset
    class="ui-fieldset"
    aria-describedby="form-kitchen-sink-2-description"
  >
    <legend>User profile</legend>
    <p class="ui-description" id="form-kitchen-sink-2-description">
      Please provide your basic contact details.
    </p>
    <div class="ui-field-group">
      <div class="ui-text-field">
        <label class="ui-label" for="form-kitchen-sink-7">Full name</label>
        <span class="ui-field">
          <input
            autocomplete="name"
            placeholder="Ada Lovelace"
            required
            id="form-kitchen-sink-7"
            type="text"
          />
        </span>
      </div>
      <div class="ui-text-field">
        <label class="ui-label" for="form-kitchen-sink-8">Email address</label>
        <span class="ui-field">
          <input
            autocomplete="email"
            placeholder="name@example.com"
            required
            id="form-kitchen-sink-8"
            type="email"
          />
        </span>
      </div>
      <div class="ui-select">
        <label class="ui-label" for="form-kitchen-sink-9">Role</label>
        <span class="ui-field">
          <select id="form-kitchen-sink-9">
            <button>
              <selectedcontent></selectedcontent>
            </button>
            <div class="ui-list">
              <option value="design">Designer</option>
              <option value="dev">Developer</option>
              <option value="manager">Manager</option>
            </div>
          </select>
        </span>
      </div>
    </div>
  </fieldset>
  <hr class="ui-divider" />
  <fieldset
    class="ui-fieldset"
    aria-describedby="form-kitchen-sink-3-description"
  >
    <legend>Notifications</legend>
    <p class="ui-description" id="form-kitchen-sink-3-description">
      Configure how you want to receive updates.
    </p>
    <div class="ui-field-group">
      <label class="ui-switch">
        <input type="checkbox" role="switch" name="email_notifs" checked />
        <span class="ui-label">Email notifications</span>
      </label>
      <label class="ui-switch">
        <input type="checkbox" role="switch" name="sms_notifs" />
        <span class="ui-label">SMS notifications</span>
      </label>
    </div>
  </fieldset>
  <hr class="ui-divider" />
  <fieldset
    class="ui-fieldset"
    aria-describedby="form-kitchen-sink-4-description"
  >
    <legend>Theme preference</legend>
    <p class="ui-description" id="form-kitchen-sink-4-description">
      Select your preferred visual style.
    </p>
    <div class="ui-field-group">
      <label class="ui-radio">
        <input type="radio" name="theme" checked value="light" />
        <span class="ui-label">Light theme</span>
      </label>
      <label class="ui-radio">
        <input type="radio" name="theme" value="dark" />
        <span class="ui-label">Dark theme</span>
      </label>
      <label class="ui-radio">
        <input type="radio" name="theme" value="system" />
        <span class="ui-label">System default</span>
      </label>
    </div>
  </fieldset>
  <hr class="ui-divider" />
  <fieldset
    class="ui-fieldset"
    aria-describedby="form-kitchen-sink-5-description"
  >
    <legend>Experience level</legend>
    <p class="ui-description" id="form-kitchen-sink-5-description">
      How many years of experience do you have?
    </p>
    <div class="ui-field-group">
      <label class="ui-range">
        <span class="ui-label" id="form-kitchen-sink-10-label"
          >Professional experience</span
        >
        <span class="ui-start-text" id="form-kitchen-sink-10-start-text"
          >Drag the slider to match your total tenure.</span
        >
        <input
          aria-describedby="form-kitchen-sink-10-start-text"
          aria-labelledby="form-kitchen-sink-10-label"
          max="20"
          min="0"
          step="1"
          type="range"
          value="5"
        />
      </label>
    </div>
  </fieldset>
  <hr class="ui-divider" />
  <fieldset
    class="ui-fieldset"
    aria-describedby="form-kitchen-sink-6-description"
  >
    <legend>Additional info</legend>
    <p class="ui-description" id="form-kitchen-sink-6-description">
      Anything else we should know?
    </p>
    <div class="ui-field-group">
      <div class="ui-textarea">
        <label class="ui-label" for="form-kitchen-sink-11">Biography</label>
        <span class="ui-field">
          <textarea
            placeholder="Tell us about yourself..."
            rows="4"
            id="form-kitchen-sink-11"
            name="biography"
          ></textarea>
        </span>
      </div>
    </div>
  </fieldset>
  <hr class="ui-divider" />
  <fieldset class="ui-fieldset">
    <legend>Legal</legend>
    <div class="ui-field-group">
      <label class="ui-checkbox">
        <input type="checkbox" name="terms" required />
        <span class="ui-label">I agree to the terms and conditions</span>
        <span class="ui-end-text"
          >You can withdraw your consent at any time.</span
        >
      </label>
    </div>
  </fieldset>
  <hr class="ui-divider" />
  <div class="ui-field-group">
    <button class="ui-button" type="button">Cancel</button>
    <button class="ui-button ui-filled" type="submit">Send</button>
  </div>
</form>
