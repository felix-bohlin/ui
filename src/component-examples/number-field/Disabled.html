<opui-number-field class="ui-number-field">
  <label class="ui-label" for="number-field-disabled-1">Quantity</label>
  <span class="ui-field">
    <span class="ui-start">
      <button
        class="ui-button ui-round"
        type="button"
        aria-controls="number-field-disabled-1"
        aria-label="Decrease"
        command="--step-down"
        commandfor="number-field-disabled-1"
      >
        <svg
          aria-hidden="true"
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
        >
          <path fill="currentColor" d="M19 13H5v-2h14z"></path>
        </svg>
      </button>
    </span>
    <input disabled value="1" id="number-field-disabled-1" type="number" />
    <span class="ui-end">
      <button
        class="ui-button ui-round"
        type="button"
        aria-controls="number-field-disabled-1"
        aria-label="Increase"
        command="--step-up"
        commandfor="number-field-disabled-1"
      >
        <svg
          aria-hidden="true"
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
        >
          <path
            fill="currentColor"
            d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6z"
          ></path>
        </svg>
      </button>
    </span>
  </span>
</opui-number-field>

<script type="module">
  import "opui-css/elements/number-field.js"
</script>
