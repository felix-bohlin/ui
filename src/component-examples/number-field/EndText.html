<opui-number-field class="ui-number-field">
  <label class="ui-label" for="number-field-end-text-1">Guests</label>
  <span class="ui-field">
    <span class="ui-start">
      <button
        type="button"
        class="ui-button ui-round"
        aria-label="Decrease"
        commandfor="number-field-end-text-1"
        command="--step-down"
      >
        <svg
          aria-hidden="true"
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
        >
          <path fill="currentColor" d="M19 13H5v-2h14z"></path>
        </svg>
      </button>
    </span>
    <input
      aria-describedby="number-field-end-text-1-end-text"
      id="number-field-end-text-1"
      type="number"
      min="1"
      max="8"
      value="2"
    />
    <span class="ui-end">
      <button
        type="button"
        class="ui-button ui-round"
        aria-label="Increase"
        commandfor="number-field-end-text-1"
        command="--step-up"
      >
        <svg
          aria-hidden="true"
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
        >
          <path
            fill="currentColor"
            d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6z"
          ></path>
        </svg>
      </button>
    </span>
  </span>
  <span class="ui-end-text" id="number-field-end-text-1-end-text"
    >Up to 8 per table.</span
  >
</opui-number-field>

<script type="module">
  import "opui-css/elements/number-field.js"
</script>
