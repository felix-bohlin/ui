<opui-number-field class="ui-number-field">
  <label class="ui-label" for="number-field-end-text-1">Guests</label>
  <span class="ui-field">
    <span class="ui-start">
      <button
        class="ui-button ui-round"
        type="button"
        aria-controls="number-field-end-text-1"
        aria-label="Decrease"
        command="--step-down"
        commandfor="number-field-end-text-1"
      >
        <svg
          aria-hidden="true"
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
        ></svg>
      </button>
    </span>
    <input
      max="8"
      min="1"
      value="2"
      aria-describedby="number-field-end-text-1-end-text"
      id="number-field-end-text-1"
      type="number"
    />
    <span class="ui-end">
      <button
        class="ui-button ui-round"
        type="button"
        aria-controls="number-field-end-text-1"
        aria-label="Increase"
        command="--step-up"
        commandfor="number-field-end-text-1"
      >
        <svg
          aria-hidden="true"
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
        ></svg>
      </button>
    </span>
  </span>
  <span class="ui-end-text" id="number-field-end-text-1-end-text"
    >Up to 8 per table.</span
  >
</opui-number-field>

<script type="module">
  import "opui-css/elements/number-field.js"
</script>
