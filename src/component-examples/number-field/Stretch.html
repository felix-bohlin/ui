<div class="ui-field">
  <label class="ui-label" for="number-field-stretch-1">Quantity</label>
  <span class="ui-field-container">
    <span class="ui-start" id="number-field-stretch-1-start">
      <opui-step-button>
        <button
          class="ui-button ui-round"
          type="button"
          aria-controls="number-field-stretch-1"
          aria-label="Decrease"
          command="--step-down"
          commandfor="number-field-stretch-1"
        >
          <svg
            aria-hidden="true"
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
          ></svg>
        </button>
      </opui-step-button>
    </span>
    <input
      id="number-field-stretch-1"
      max="10"
      min="1"
      type="number"
      value="1"
    />
    <span class="ui-end" id="number-field-stretch-1-end">
      <opui-step-button>
        <button
          class="ui-button ui-round"
          type="button"
          aria-controls="number-field-stretch-1"
          aria-label="Increase"
          command="--step-up"
          commandfor="number-field-stretch-1"
        >
          <svg
            aria-hidden="true"
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
          ></svg>
        </button>
      </opui-step-button>
    </span>
  </span>
</div>

<script type="module">
  import "opui-css/elements/step-button.js"
</script>
