<div class="ui-field ui-auto-fit">
  <label class="ui-label" for="number-field-unit-1">Weight</label>
  <span class="ui-field-container">
    <span class="ui-start" id="number-field-unit-1-start">
      <opui-step-button>
        <button
          class="ui-button ui-round"
          type="button"
          aria-controls="number-field-unit-1"
          aria-label="Decrease"
          command="--step-down"
          commandfor="number-field-unit-1"
        >
          <svg
            aria-hidden="true"
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
          ></svg>
        </button>
      </opui-step-button>
    </span>
    <input
      aria-describedby="number-field-unit-1-end-text"
      id="number-field-unit-1"
      max="30"
      min="0.5"
      step="0.5"
      type="number"
      value="2.5"
    />
    <span class="ui-end" id="number-field-unit-1-end">
      <opui-step-button>
        <button
          class="ui-button ui-round"
          type="button"
          aria-controls="number-field-unit-1"
          aria-label="Increase"
          command="--step-up"
          commandfor="number-field-unit-1"
        >
          <svg
            aria-hidden="true"
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
          ></svg>
        </button>
      </opui-step-button>
    </span>
  </span>
  <span class="ui-end-text" id="number-field-unit-1-end-text">kg</span>
</div>

<script type="module">
  import "opui-css/elements/step-button.js"
</script>
