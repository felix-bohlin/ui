<opui-number-field class="ui-number-field">
  <label class="ui-label" for="number-field-variants-1">Guests</label>
  <span class="ui-field">
    <span class="ui-start">
      <button
        class="ui-button ui-round"
        type="button"
        aria-controls="number-field-variants-1"
        aria-label="Decrease"
        command="--step-down"
        commandfor="number-field-variants-1"
      >
        <svg
          aria-hidden="true"
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
        ></svg>
      </button>
    </span>
    <input value="1" id="number-field-variants-1" type="number" />
    <span class="ui-end">
      <button
        class="ui-button ui-round"
        type="button"
        aria-controls="number-field-variants-1"
        aria-label="Increase"
        command="--step-up"
        commandfor="number-field-variants-1"
      >
        <svg
          aria-hidden="true"
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
        ></svg>
      </button>
    </span>
  </span>
</opui-number-field>
