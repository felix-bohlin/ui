<opui-number-stepper class="ui-number-stepper">
  <label class="ui-label" for="number-stepper-end-text-1">Guests</label>
  <span class="ui-field">
    <span class="ui-start">
      <button
        class="ui-button ui-round"
        type="button"
        aria-label="Decrease"
        command="--step-down"
        commandfor="number-stepper-end-text-1"
      >
        <svg
          aria-hidden="true"
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
        >
          <path fill="currentColor" d="M19 13H5v-2h14z"></path>
        </svg>
      </button>
    </span>
    <input
      max="8"
      min="1"
      value="2"
      aria-describedby="number-stepper-end-text-1-end-text"
      id="number-stepper-end-text-1"
      type="number"
    />
    <span class="ui-end">
      <button
        class="ui-button ui-round"
        type="button"
        aria-label="Increase"
        command="--step-up"
        commandfor="number-stepper-end-text-1"
      >
        <svg
          aria-hidden="true"
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
        >
          <path
            fill="currentColor"
            d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6z"
          ></path>
        </svg>
      </button>
    </span>
  </span>
  <span class="ui-end-text" id="number-stepper-end-text-1-end-text"
    >Up to 8 per table.</span
  >
</opui-number-stepper>

<script type="module">
  import "opui-css/elements/number-stepper.js"
</script>
