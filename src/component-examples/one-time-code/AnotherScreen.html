<div class="ui-one-time-code">
  <label class="ui-label" for="one-time-code-another-screen-1"
    >Code from your TV</label
  >
  <span class="ui-field">
    <input
      autocomplete="off"
      inputmode="numeric"
      pattern="[0-9]{6}"
      required
      aria-describedby="one-time-code-another-screen-1-end-text"
      id="one-time-code-another-screen-1"
      maxlength="6"
      name="code"
      type="text"
    />
  </span>
  <span class="ui-end-text" id="one-time-code-another-screen-1-end-text"
    >The code is on your TV, under Settings and Link a device.</span
  >
</div>
