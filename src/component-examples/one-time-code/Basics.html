<label class="ui-text-field ui-one-time-code">
  <span class="ui-label">Verification code</span>
  <span class="ui-field">
    <input
      inputmode="numeric"
      pattern="[0-9]{6}"
      required
      autocomplete="one-time-code"
      maxlength="6"
      name="code"
      type="text"
    />
  </span>
  <span class="ui-end-text">The code expires in 10 minutes.</span>
</label>
