<label class="ui-text-field ui-one-time-code">
  <span class="ui-label">PIN</span>
  <span class="ui-field">
    <input
      inputmode="numeric"
      pattern="[0-9]{4}"
      autocomplete="one-time-code"
      maxlength="4"
      name="pin"
      type="text"
    />
  </span>
</label>
<label class="ui-text-field ui-one-time-code ui-grouped">
  <span class="ui-label">Backup code</span>
  <span class="ui-field">
    <input
      inputmode="numeric"
      pattern="[0-9]{8}"
      autocomplete="one-time-code"
      maxlength="8"
      name="backup-code"
      type="text"
    />
  </span>
</label>
