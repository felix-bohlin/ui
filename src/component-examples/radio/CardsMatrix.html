<form class="ui-form">
  <fieldset class="ui-fieldset">
    <legend>Plan</legend>
    <div class="ui-field-group ui-horizontal">
      <label class="ui-radio ui-card ui-spread">
        <input type="radio" name="radio-cards-end" checked value="basic" />
        <span class="ui-label">Basic</span>
        <span class="ui-end-text">€0 per month, forever</span>
      </label>
      <label class="ui-radio ui-card ui-spread ui-elevated">
        <input type="radio" name="radio-cards-end" value="gold" />
        <span class="ui-label">Gold</span>
        <span class="ui-end-text">€3 per month, shiny badge included</span>
      </label>
      <label class="ui-radio ui-card ui-spread ui-tonal">
        <input type="radio" name="radio-cards-end" value="platinum" />
        <span class="ui-label">Platinum</span>
        <span class="ui-end-text">€5 per month, extra sparkly</span>
      </label>
    </div>
  </fieldset>
  <fieldset class="ui-fieldset">
    <legend>Billing</legend>
    <div class="ui-field-group ui-horizontal">
      <label class="ui-radio ui-card">
        <input type="radio" name="radio-cards-start" checked value="monthly" />
        <span class="ui-label">Monthly</span>
        <span class="ui-end-text">Cancel any time, no hard feelings.</span>
      </label>
      <label class="ui-radio ui-card ui-elevated">
        <input type="radio" name="radio-cards-start" value="yearly" />
        <span class="ui-label">Yearly</span>
        <span class="ui-end-text">Two months free, woohoo.</span>
      </label>
      <label class="ui-radio ui-card ui-tonal">
        <input type="radio" name="radio-cards-start" value="gig-money" />
        <span class="ui-label">Gig money</span>
        <span class="ui-end-text">Pay in coins after your next gig.</span>
      </label>
    </div>
  </fieldset>
</form>
