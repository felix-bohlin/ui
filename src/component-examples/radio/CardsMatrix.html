<form class="ui-form">
  <fieldset class="ui-fieldset">
    <legend>Plan</legend>
    <div class="ui-field-group ui-horizontal">
      <label class="ui-radio ui-card ui-spread">
        <input type="radio" name="radio-cards-end" checked value="starter" />
        <span class="ui-label">Starter</span>
        <span class="ui-end-text">€0 per month</span>
      </label>
      <label class="ui-radio ui-card ui-spread ui-elevated">
        <input type="radio" name="radio-cards-end" value="team" />
        <span class="ui-label">Team</span>
        <span class="ui-end-text">€12 per person per month</span>
      </label>
      <label class="ui-radio ui-card ui-spread ui-tonal">
        <input type="radio" name="radio-cards-end" value="business" />
        <span class="ui-label">Business</span>
        <span class="ui-end-text">€24 per person per month</span>
      </label>
    </div>
  </fieldset>
  <fieldset class="ui-fieldset">
    <legend>Billing</legend>
    <div class="ui-field-group ui-horizontal">
      <label class="ui-radio ui-card">
        <input type="radio" name="radio-cards-start" checked value="monthly" />
        <span class="ui-label">Monthly</span>
        <span class="ui-end-text">Cancel at any time.</span>
      </label>
      <label class="ui-radio ui-card ui-elevated">
        <input type="radio" name="radio-cards-start" value="yearly" />
        <span class="ui-label">Yearly</span>
        <span class="ui-end-text">Two months free.</span>
      </label>
      <label class="ui-radio ui-card ui-tonal">
        <input type="radio" name="radio-cards-start" value="invoice" />
        <span class="ui-label">Invoice</span>
        <span class="ui-end-text">Pay by bank transfer.</span>
      </label>
    </div>
  </fieldset>
</form>
