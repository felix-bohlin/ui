<fieldset class="ui-fieldset">
  <legend>Plan</legend>
  <div class="ui-field-group">
    <label class="ui-radio">
      <input type="radio" name="radio-binding" checked value="basic" />
      <span class="ui-label">Basic</span>
    </label>
    <label class="ui-radio">
      <input type="radio" name="radio-binding" value="gold" />
      <span class="ui-label">Gold</span>
    </label>
    <label class="ui-radio">
      <input type="radio" name="radio-binding" value="platinum" />
      <span class="ui-label">Platinum</span>
    </label>
  </div>
</fieldset>
<p class="radio-binding-text">Selected: basic</p>
<button class="ui-button radio-binding-reset" type="button">Reset</button>

<script type="module">
  const text = document.querySelector(".radio-binding-text")
  const inputs = [...document.querySelectorAll('[name="radio-binding"]')]

  function update() {
    if (!text) return
    text.textContent = `Selected: ${
      inputs.find((input) => input.checked)?.value ?? "none"
    }`
  }

  inputs.forEach((input) => input.addEventListener("change", update))
  document
    .querySelector(".radio-binding-reset")
    ?.addEventListener("click", () => {
      inputs.forEach((input) => (input.checked = input.defaultChecked))
      update()
    })
</script>
