<form class="ui-form">
  <fieldset class="ui-fieldset" disabled>
    <legend>Legend</legend>
    <div class="ui-field-group ui-horizontal">
      <label class="ui-radio">
        <input type="radio" name="radio-group-disabled" checked value="1" />
        <span class="ui-label">Radio 1</span>
      </label>
      <label class="ui-radio">
        <input type="radio" name="radio-group-disabled" value="2" />
        <span class="ui-label">Radio 2</span>
      </label>
      <label class="ui-radio">
        <input type="radio" name="radio-group-disabled" value="3" />
        <span class="ui-label">Radio 3</span>
      </label>
    </div>
  </fieldset>
  <fieldset class="ui-fieldset">
    <legend>One by one</legend>
    <div class="ui-field-group ui-horizontal">
      <label class="ui-radio">
        <input
          type="radio"
          name="radio-group-disabled-single"
          checked
          value="1"
        />
        <span class="ui-label">Enabled</span>
      </label>
      <label class="ui-radio">
        <input
          type="radio"
          name="radio-group-disabled-single"
          disabled
          value="2"
        />
        <span class="ui-label">Disabled</span>
      </label>
      <label class="ui-radio">
        <input
          type="radio"
          name="radio-group-disabled-single"
          aria-disabled="true"
          value="3"
        />
        <span class="ui-label">Aria-disabled</span>
      </label>
    </div>
  </fieldset>
</form>
