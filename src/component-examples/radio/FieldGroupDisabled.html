<form class="ui-form">
  <fieldset class="ui-fieldset" disabled>
    <legend>Band practice</legend>
    <div class="ui-field-group ui-horizontal">
      <label class="ui-radio">
        <input
          type="radio"
          name="radio-group-disabled"
          checked
          value="weekly"
        />
        <span class="ui-label">Weekly</span>
      </label>
      <label class="ui-radio">
        <input type="radio" name="radio-group-disabled" value="monthly" />
        <span class="ui-label">Monthly</span>
      </label>
      <label class="ui-radio">
        <input type="radio" name="radio-group-disabled" value="drummer" />
        <span class="ui-label">When the drummer shows up</span>
      </label>
    </div>
  </fieldset>
  <fieldset class="ui-fieldset">
    <legend>Delivery</legend>
    <div class="ui-field-group ui-horizontal">
      <label class="ui-radio">
        <input
          type="radio"
          name="radio-group-disabled-single"
          checked
          value="standard"
        />
        <span class="ui-label">Standard</span>
      </label>
      <label class="ui-radio">
        <input
          type="radio"
          name="radio-group-disabled-single"
          disabled
          value="same-day"
        />
        <span class="ui-label">Same day</span>
      </label>
    </div>
  </fieldset>
</form>
