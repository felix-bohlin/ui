<form class="ui-form">
  <fieldset
    class="ui-fieldset"
    aria-describedby="radio-field-group-field-description-1-description"
  >
    <legend>Contact method</legend>
    <p
      class="ui-description"
      id="radio-field-group-field-description-1-description"
    >
      We only contact you about your order.
    </p>
    <div class="ui-field-group ui-horizontal">
      <label class="ui-radio">
        <input
          type="radio"
          name="radio-group-field-description-1"
          checked
          value="email"
        />
        <span class="ui-label">Email</span>
      </label>
      <label class="ui-radio">
        <input
          type="radio"
          name="radio-group-field-description-1"
          value="phone"
        />
        <span class="ui-label">Phone</span>
      </label>
      <label class="ui-radio">
        <input
          type="radio"
          name="radio-group-field-description-1"
          value="sms"
        />
        <span class="ui-label">SMS</span>
      </label>
    </div>
  </fieldset>
  <fieldset
    class="ui-fieldset"
    aria-describedby="radio-field-group-field-description-2-description"
  >
    <legend>Theme</legend>
    <div class="ui-field-group ui-horizontal">
      <label class="ui-radio">
        <input
          type="radio"
          name="radio-group-field-description-2"
          checked
          value="system"
        />
        <span class="ui-label">System</span>
      </label>
      <label class="ui-radio">
        <input
          type="radio"
          name="radio-group-field-description-2"
          value="light"
        />
        <span class="ui-label">Light</span>
      </label>
      <label class="ui-radio">
        <input
          type="radio"
          name="radio-group-field-description-2"
          value="dark"
        />
        <span class="ui-label">Dark</span>
      </label>
    </div>
    <p
      class="ui-description"
      id="radio-field-group-field-description-2-description"
    >
      System follows your device setting.
    </p>
  </fieldset>
</form>
