<form class="ui-form">
  <fieldset class="ui-fieldset">
    <legend>Spot on stage</legend>
    <div class="ui-field-group ui-horizontal">
      <label class="ui-radio">
        <input
          type="radio"
          name="radio-group-orientation"
          checked
          value="front"
        />
        <span class="ui-label">Front</span>
      </label>
      <label class="ui-radio">
        <input type="radio" name="radio-group-orientation" value="middle" />
        <span class="ui-label">Middle</span>
      </label>
      <label class="ui-radio">
        <input type="radio" name="radio-group-orientation" value="amp" />
        <span class="ui-label">Behind the amp</span>
      </label>
    </div>
  </fieldset>
</form>
