<form class="ui-form">

    <legend>Seat</legend>

        <input
          type="radio"
          name="radio-group-orientation"
          checked
          value="window"
        />

      </label>
      <label class="ui-radio">
        <input type="radio" name="radio-group-orientation" value="middle" />

      </label>
      <label class="ui-radio">
        <input type="radio" name="radio-group-orientation" value="aisle" />
        <span class="ui-label">Aisle</span>
      </label>
    </div>
  </fieldset>
</form>
