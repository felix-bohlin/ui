<form class="ui-form">
  <label class="ui-range" for="range-value-1">
    <span class="ui-label" id="range-value-1-label">Hue</span>
    <output
      aria-live="off"
      class="ui-value"
      data-live
      for="range-value-1"
      data-suffix="°"
      >250°</output
    >
    <input
      aria-labelledby="range-value-1-label"
      aria-valuetext="250°"
      id="range-value-1"
      max="360"
      min="0"
      type="range"
      value="250"
    />
  </label>
  <div class="ui-field-group">
    <button class="ui-button" type="reset">Reset</button>
  </div>
</form>

<script type="module">
  import "opui-css/css/js/range.js"
</script>
