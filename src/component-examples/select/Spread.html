<label class="ui-select ui-spread">
  <span class="ui-label" id="select-spread-1-label">Country</span>
  <span class="ui-field">
    <select aria-labelledby="select-spread-1-label">
      <button>
        <selectedcontent></selectedcontent>
      </button>
      <div class="ui-list">
        <option value="">-</option>
        <option>Denmark</option>
        <option>Finland</option>
        <option>Iceland</option>
        <option>Norway</option>
        <option>Sweden</option>
      </div>
    </select>
  </span>
</label>

<label class="ui-select ui-filled ui-spread">
  <span class="ui-label" id="select-spread-2-label">Language</span>
  <span class="ui-start-text" id="select-spread-2-start-text"
    >Choose your preferred language.</span
  >
  <span class="ui-field">
    <select
      aria-describedby="select-spread-2-start-text select-spread-2-end-text"
      aria-labelledby="select-spread-2-label"
    >
      <button>
        <selectedcontent></selectedcontent>
      </button>
      <div class="ui-list">
        <option value="">-</option>
        <option>Danish</option>
        <option>Finnish</option>
        <option>Icelandic</option>
        <option>Norwegian</option>
        <option>Swedish</option>
      </div>
    </select>
  </span>
  <span id="select-spread-2-end-text" class="ui-end-text"
    >This affects UI translations.</span
  >
</label>

<label class="ui-select ui-spread">
  <span class="ui-label" id="select-spread-3-label">Forum</span>
  <span class="ui-start-text" id="select-spread-3-start-text"
    >Posts your question where the right bassists hang out.</span
  >
  <span class="ui-field">
    <select
      required
      aria-describedby="select-spread-3-start-text"
      aria-labelledby="select-spread-3-label"
    >
      <button>
        <selectedcontent></selectedcontent>
      </button>
      <div class="ui-list">
        <option value="">-</option>
        <option>Gear Talk</option>
        <option>Ignored Bassists Anonymous</option>
      </div>
    </select>
  </span>
</label>

<label class="ui-select ui-spread">
  <span class="ui-label" id="select-spread-4-label">Plan</span>
  <span class="ui-start-text" id="select-spread-4-start-text"
    >A gift from your band, aww.</span
  >
  <span class="ui-field">
    <select
      disabled
      aria-describedby="select-spread-4-start-text"
      aria-labelledby="select-spread-4-label"
    >
      <button>
        <selectedcontent></selectedcontent>
      </button>
      <div class="ui-list">
        <option>Gold</option>
      </div>
    </select>
  </span>
</label>

<label class="ui-select ui-spread">
  <span class="ui-label" id="select-spread-5-label">Payment method</span>
  <span class="ui-start-text" id="select-spread-5-start-text"
    >Bassbook Gold renews on the first of each month.</span
  >
  <span class="ui-field">
    <select
      aria-describedby="select-spread-5-start-text select-spread-5-end-text"
      aria-invalid="true"
      aria-labelledby="select-spread-5-label"
    >
      <button>
        <selectedcontent></selectedcontent>
      </button>
      <div class="ui-list">
        <option>Visa ending in 4242</option>
        <option>Mastercard ending in 5100</option>
      </div>
    </select>
  </span>
  <span id="select-spread-5-end-text" class="ui-end-text"
    >This card has expired. Pick another one.</span
  >
</label>

<label class="ui-select ui-spread">
  <span class="ui-label" id="select-spread-6-label">Time zone</span>
  <span class="ui-start-text" id="select-spread-6-start-text"
    >Used for gig and rehearsal reminders.</span
  >
  <span class="ui-field">
    <select
      aria-describedby="select-spread-6-start-text"
      aria-labelledby="select-spread-6-label select-spread-6-start"
    >
      <button>
        <selectedcontent></selectedcontent>
      </button>
      <div class="ui-list">
        <option>-03:00</option>
        <option>+00:00</option>
        <option>+01:00</option>
        <option>+05:30</option>
        <option>+09:00</option>
      </div>
    </select>
    <span class="ui-start" id="select-spread-6-start">UTC</span>
  </span>
</label>

<label class="ui-select ui-filled ui-spread">
  <span class="ui-label" id="select-spread-7-label">Jam region</span>

        <option>Asia</option>
        <option>Europe</option>
        <option>North America</option>

        <circle cx="12" cy="12" r="10"></circle>
        <path d="M2 12h20"></path>

          d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"
