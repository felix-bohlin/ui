<form class="ui-form">
  <fieldset class="ui-fieldset">
    <legend>Notifications</legend>
    <div class="ui-field-group">
      <label class="ui-switch">
        <input
          type="checkbox"
          role="switch"
          name="switch-group"
          value="email"
        />
        <span class="ui-label">Email</span>
      </label>
      <label class="ui-switch">
        <input type="checkbox" role="switch" name="switch-group" value="push" />
        <span class="ui-label">Push</span>
      </label>
      <label class="ui-switch">
        <input type="checkbox" role="switch" name="switch-group" value="sms" />
        <span class="ui-label">SMS</span>
      </label>
    </div>
  </fieldset>
</form>
