<form class="ui-form">
  <fieldset class="ui-fieldset" disabled>
    <legend>Share with friends</legend>
    <div class="ui-field-group ui-horizontal">
      <label class="ui-switch">
        <input
          type="checkbox"
          role="switch"
          name="switch-group-disabled"
          value="profile"
        />
        <span class="ui-label">Profile</span>
      </label>
      <label class="ui-switch">
        <input
          type="checkbox"
          role="switch"
          name="switch-group-disabled"
          value="activity"
        />
        <span class="ui-label">Activity</span>
      </label>
      <label class="ui-switch">
        <input
          type="checkbox"
          role="switch"
          name="switch-group-disabled"
          value="location"
        />
        <span class="ui-label">Location</span>
      </label>
    </div>
  </fieldset>
  <fieldset class="ui-fieldset">
    <legend>Sync</legend>
    <div class="ui-field-group ui-horizontal">
      <label class="ui-switch">
        <input
          type="checkbox"
          role="switch"
          name="switch-group-disabled-single"
          checked
          value="contacts"
        />
        <span class="ui-label">Contacts</span>
      </label>
      <label class="ui-switch">
        <input
          type="checkbox"
          role="switch"
          name="switch-group-disabled-single"
          disabled
          value="photos"
        />
        <span class="ui-label">Photos</span>
      </label>
    </div>
  </fieldset>
</form>
