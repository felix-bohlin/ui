<form class="ui-form">
  <fieldset
    class="ui-fieldset"
    aria-describedby="switch-field-group-field-description-1-description"
  >
    <legend>Email me about</legend>
    <p
      class="ui-description"
      id="switch-field-group-field-description-1-description"
    >
      We send at most one email a week.
    </p>
    <div class="ui-field-group ui-horizontal">
      <label class="ui-switch">
        <input
          type="checkbox"
          role="switch"
          name="switch-group-field-description-1"
          value="news"
        />
        <span class="ui-label">Product news</span>
      </label>
      <label class="ui-switch">
        <input
          type="checkbox"
          role="switch"
          name="switch-group-field-description-1"
          value="tips"
        />
        <span class="ui-label">Tips</span>
      </label>
      <label class="ui-switch">
        <input
          type="checkbox"
          role="switch"
          name="switch-group-field-description-1"
          value="offers"
        />
        <span class="ui-label">Offers</span>
      </label>
    </div>
  </fieldset>
  <fieldset
    class="ui-fieldset"
    aria-describedby="switch-field-group-field-description-2-description"
  >
    <legend>Accessibility</legend>
    <div class="ui-field-group ui-horizontal">
      <label class="ui-switch">
        <input
          type="checkbox"
          role="switch"
          name="switch-group-field-description-2"
          value="reduce-motion"
        />
        <span class="ui-label">Reduce motion</span>
      </label>
      <label class="ui-switch">
        <input
          type="checkbox"
          role="switch"
          name="switch-group-field-description-2"
          value="high-contrast"
        />
        <span class="ui-label">High contrast</span>
      </label>
      <label class="ui-switch">
        <input
          type="checkbox"
          role="switch"
          name="switch-group-field-description-2"
          value="captions"
        />
        <span class="ui-label">Captions</span>
      </label>
    </div>
    <p
      class="ui-description"
      id="switch-field-group-field-description-2-description"
    >
      These apply on this device only.
    </p>
  </fieldset>
</form>
