<label class="ui-switch ui-spread">
  <input
    type="checkbox"
    role="switch"
    name="switch-spread"
    value="notifications"
  />
  <span class="ui-label">Notifications</span>
  <span class="ui-end-text">Receive alerts when someone mentions you.</span>
</label>

<label class="ui-switch ui-spread">
  <input
    type="checkbox"
    role="switch"
    name="switch-spread"
    required
    value="two-step-login"
  />
  <span class="ui-label">Two-step login</span>
  <span class="ui-end-text">Your organization requires it for admins.</span>
</label>

<label class="ui-switch ui-spread">
  <input
    type="checkbox"
    role="switch"
    name="switch-spread"
    disabled
    value="location"
  />
  <span class="ui-label">Location access</span>
  <span class="ui-end-text">Turned off by your administrator.</span>
</label>

<label class="ui-switch ui-spread">
  <input
    type="checkbox"
    role="switch"
    name="switch-spread"
    value="backup"
    aria-invalid="true"
  />
  <span class="ui-label">Cloud backup</span>
  <span class="ui-end-text"
    >Sync needs cloud backup. Turn it on to continue.</span
  >
</label>
