<div class="ui-text-field">
  <label class="ui-label" for="text-field-binding-1">Name</label>
  <span class="ui-field">
    <input
      value="Hakki"
      id="text-field-binding-1"
      name="text-field-binding"
      type="text"
    />
  </span>
</div>
<p class="text-field-binding-text">Hello, Hakki.</p>
<button class="ui-button text-field-binding-reset" type="button">Reset</button>

<script type="module">
  const text = document.querySelector(".text-field-binding-text")
  const input = document.querySelector('[name="text-field-binding"]')

  function update() {
    if (!text || !input) return
    text.textContent = `Hello, ${input.value || "stranger"}.`
  }

  input?.addEventListener("input", update)
  document
    .querySelector(".text-field-binding-reset")
    ?.addEventListener("click", () => {
      if (input) input.value = input.defaultValue
      update()
    })
</script>
