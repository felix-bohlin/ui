<div class="example-column">
  <label class="ui-text-field">
    <span class="ui-label" id="text-field-input-types-1-label">Color</span>
    <span class="ui-field">
      <input aria-labelledby="text-field-input-types-1-label" type="color" />
    </span>
  </label>
  <label class="ui-text-field">
    <span class="ui-label" id="text-field-input-types-2-label">Email</span>
    <span class="ui-field">
      <input
        placeholder="name@example.com"
        aria-labelledby="text-field-input-types-2-label"
        type="email"
      />
    </span>
  </label>
  <label class="ui-text-field">
    <span class="ui-label" id="text-field-input-types-3-label">Password</span>
    <span class="ui-field">
      <input
        placeholder="Password"
        aria-labelledby="text-field-input-types-3-label"
        type="password"
      />
    </span>
  </label>
  <label class="ui-text-field">
    <span class="ui-label" id="text-field-input-types-4-label">Search</span>
    <span class="ui-field">
      <input
        placeholder="Search"
        aria-labelledby="text-field-input-types-4-label"
        type="search"
      />
    </span>
  </label>
  <label class="ui-text-field">
    <span class="ui-label" id="text-field-input-types-5-label">Phone</span>
    <span class="ui-field">
      <input
        placeholder="(555) 010-0100"
        aria-labelledby="text-field-input-types-5-label"
        type="tel"
      />
    </span>
  </label>
  <label class="ui-text-field">
    <span class="ui-label" id="text-field-input-types-6-label">Text</span>
    <span class="ui-field">
      <input
        placeholder="Text"
        aria-labelledby="text-field-input-types-6-label"
        type="text"
      />
    </span>
  </label>
  <label class="ui-text-field">
    <span class="ui-label" id="text-field-input-types-7-label">URL</span>
    <span class="ui-field">
      <input
        placeholder="https://example.com"
        aria-labelledby="text-field-input-types-7-label"
        type="url"
      />
    </span>
  </label>
</div>

<div class="example-column">
  <label class="ui-text-field">
    <span class="ui-label" id="text-field-input-types-8-label">Date</span>
    <span class="ui-field">
      <input aria-labelledby="text-field-input-types-8-label" type="date" />
    </span>
  </label>
  <label class="ui-text-field">
    <span class="ui-label" id="text-field-input-types-9-label"
      >Datetime local</span
    >
    <span class="ui-field">
      <input
        aria-labelledby="text-field-input-types-9-label"
        type="datetime-local"
      />
    </span>
  </label>
  <label class="ui-text-field">
    <span class="ui-label" id="text-field-input-types-10-label">Month</span>
    <span class="ui-field">
      <input aria-labelledby="text-field-input-types-10-label" type="month" />
    </span>
  </label>
  <label class="ui-text-field">
    <span class="ui-label" id="text-field-input-types-11-label">Time</span>
    <span class="ui-field">
      <input aria-labelledby="text-field-input-types-11-label" type="time" />
    </span>
  </label>
  <label class="ui-text-field">
    <span class="ui-label" id="text-field-input-types-12-label">Week</span>
    <span class="ui-field">
      <input aria-labelledby="text-field-input-types-12-label" type="week" />
    </span>
  </label>
</div>
