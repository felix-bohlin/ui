<opui-text-field class="ui-text-field">
  <label class="ui-label" for="text-field-password-toggle-1">Password</label>
  <span class="ui-field">
    <input
      autocomplete="current-password"
      id="text-field-password-toggle-1"
      type="password"
    />
    <span class="ui-end">
      <button
        class="ui-button ui-round"
        type="button"
        aria-label="Show password"
        aria-pressed="false"
        command="--toggle-password"
        commandfor="text-field-password-toggle-1"
      >
        <svg
          aria-hidden="true"
          class="ui-icon-unchecked"
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
        ></svg>
        <svg
          aria-hidden="true"
          class="ui-icon-checked"
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
        ></svg>
      </button>
    </span>
  </span>
</opui-text-field>
<opui-text-field class="ui-text-field">
  <label class="ui-label" for="text-field-password-toggle-2"
    >New password</label
  >
  <span class="ui-field">
    <input
      autocomplete="new-password"
      minlength="12"
      aria-describedby="text-field-password-toggle-2-end-text"
      id="text-field-password-toggle-2"
      type="password"
    />
    <span class="ui-end">
      <button
        class="ui-button ui-round"
        type="button"
        aria-label="Show password"
        aria-pressed="false"
        command="--toggle-password"
        commandfor="text-field-password-toggle-2"
      >
        <svg
          aria-hidden="true"
          class="ui-icon-unchecked"
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
        ></svg>
        <svg
          aria-hidden="true"
          class="ui-icon-checked"
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
        ></svg>
      </button>
    </span>
  </span>
  <span class="ui-end-text" id="text-field-password-toggle-2-end-text"
    >At least 12 characters.</span
  >
</opui-text-field>

<script type="module">
  import "opui-css/elements/text-field.js"
</script>
