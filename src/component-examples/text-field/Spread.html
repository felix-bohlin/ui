<label class="ui-text-field ui-spread">
  <span class="ui-label" id="text-field-spread-1-label">Name</span>
  <span class="ui-start-text" id="text-field-spread-1-start-text"
    >Provide your full name for identification</span
  >
  <span class="ui-field">
    <input
      placeholder="Ada Lovelace"
      aria-describedby="text-field-spread-1-start-text"
      aria-labelledby="text-field-spread-1-label"
      type="text"
    />
  </span>
</label>

<label class="ui-text-field ui-filled ui-spread">
  <span class="ui-label" id="text-field-spread-2-label">Email</span>
  <span class="ui-start-text" id="text-field-spread-2-start-text"
    >We'll use this to contact you</span
  >
  <span class="ui-field">
    <input
      placeholder="name@example.com"
      aria-describedby="text-field-spread-2-start-text text-field-spread-2-end-text"
      aria-labelledby="text-field-spread-2-label"
      type="email"
    />
  </span>
  <span class="ui-end-text" id="text-field-spread-2-end-text"
    >Use a work address.</span
  >
</label>

<label class="ui-text-field ui-spread">
  <span class="ui-label" id="text-field-spread-3-label">Company</span>
  <span class="ui-start-text" id="text-field-spread-3-start-text"
    >Shown on your invoices</span
  >
  <span class="ui-field">
    <input
      required
      aria-describedby="text-field-spread-3-start-text"
      aria-labelledby="text-field-spread-3-label"
      type="text"
    />
  </span>
</label>

<label class="ui-text-field ui-spread">
  <span class="ui-label" id="text-field-spread-4-label">Account ID</span>
  <span class="ui-start-text" id="text-field-spread-4-start-text"
    >Assigned when you signed up</span
  >
  <span class="ui-field">
    <input
      disabled
      value="ACC-20931"
      aria-describedby="text-field-spread-4-start-text"
      aria-labelledby="text-field-spread-4-label"
      type="text"
    />
  </span>
</label>

<label class="ui-text-field ui-spread">
  <span class="ui-label" id="text-field-spread-5-label">Display name</span>
  <span class="ui-start-text" id="text-field-spread-5-start-text"
    >Shown next to your comments</span
  >
  <span class="ui-field">
    <input
      value="A"
      aria-describedby="text-field-spread-5-start-text text-field-spread-5-end-text"
      aria-invalid="true"
      aria-labelledby="text-field-spread-5-label"
      type="text"
    />
  </span>
  <span class="ui-end-text" id="text-field-spread-5-end-text"
    >Enter at least two characters.</span
  >
</label>

<label class="ui-text-field ui-spread">
  <span class="ui-label" id="text-field-spread-6-label">Amount</span>
  <span class="ui-start-text" id="text-field-spread-6-start-text"
    >Daily spending limit</span
  >
  <span class="ui-field">
    <input
      placeholder="0.00"
      aria-describedby="text-field-spread-6-start-text"
      aria-labelledby="text-field-spread-6-label text-field-spread-6-start text-field-spread-6-end"
      type="text"
    />
    <span class="ui-start" id="text-field-spread-6-start">€</span>
    <span class="ui-end" id="text-field-spread-6-end">EUR</span>
  </span>
</label>

<label class="ui-text-field ui-filled ui-spread">
  <span class="ui-label" id="text-field-spread-7-label">Website</span>
  <span class="ui-start-text" id="text-field-spread-7-start-text"
    >Your public profile URL</span
  >
  <span class="ui-field">
    <input
      placeholder="example.com"
      aria-describedby="text-field-spread-7-start-text text-field-spread-7-end-text"
      aria-labelledby="text-field-spread-7-label text-field-spread-7-start"
      type="text"
    />
    <span class="ui-start" id="text-field-spread-7-start">https://</span>
  </span>
  <span class="ui-end-text" id="text-field-spread-7-end-text"
    >Include the domain, like example.com.</span
  >
</label>

<label class="ui-text-field ui-spread">
  <span class="ui-label" id="text-field-spread-8-label">Project name</span>
  <span class="ui-start-text" id="text-field-spread-8-start-text"
    >Used to generate the project URL</span
  >
  <span class="ui-field">
    <input
      placeholder="my-project"
      aria-describedby="text-field-spread-8-start-text text-field-spread-8-top text-field-spread-8-bottom"
      aria-labelledby="text-field-spread-8-label"
      type="text"
    />
    <span class="ui-top" id="text-field-spread-8-top">acme.dev/</span>
    <span class="ui-bottom" id="text-field-spread-8-bottom"
      >Lowercase letters and dashes only</span
    >
  </span>
</label>

<label class="ui-text-field ui-filled ui-spread">
  <span class="ui-label" id="text-field-spread-9-label">API key</span>
  <span class="ui-start-text" id="text-field-spread-9-start-text"
    >Stored encrypted at rest</span
  >
  <span class="ui-field">
    <input
      placeholder="Paste your key"
      aria-describedby="text-field-spread-9-start-text text-field-spread-9-top text-field-spread-9-bottom text-field-spread-9-end-text"
      aria-labelledby="text-field-spread-9-label text-field-spread-9-start"
      type="password"
    />
    <span class="ui-start" id="text-field-spread-9-start">
      <svg
        aria-hidden="true"
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
      </svg>
    </span>
    <span class="ui-top" id="text-field-spread-9-top">Secret</span>
    <span class="ui-bottom" id="text-field-spread-9-bottom"
      >Rotates every 90 days</span
    >
  </span>
  <span class="ui-end-text" id="text-field-spread-9-end-text"
    >Treat it like a password.</span
  >
</label>
