<div class="example-row">
  <div class="ui-text-field">
    <label class="ui-label" for="text-field-validation-1">Full name</label>
    <span class="ui-field">
      <input
        placeholder="Hakki Hälinen"
        required
        id="text-field-validation-1"
        type="text"
      />
    </span>
  </div>
  <div class="ui-text-field ui-filled">
    <label class="ui-label" for="text-field-validation-2">Email</label>
    <span class="ui-field">
      <input
        placeholder="name@example.com"
        required
        id="text-field-validation-2"
        type="email"
      />
    </span>
  </div>
</div>

<div class="example-row">
  <div class="ui-text-field">
    <label class="ui-label" for="text-field-validation-3">Username</label>
    <span class="ui-field">
      <input
        value="ada"
        aria-describedby="text-field-validation-3-end-text"
        aria-invalid="true"
        id="text-field-validation-3"
        type="text"
      />
    </span>
    <span class="ui-end-text" id="text-field-validation-3-end-text"
      >This username is taken. Try another one.</span
    >
  </div>
  <div class="ui-text-field ui-filled">
    <label class="ui-label" for="text-field-validation-4">Discount code</label>
    <span class="ui-field">
      <input
        value="SPRING23"
        aria-describedby="text-field-validation-4-end-text"
        aria-invalid="true"
        id="text-field-validation-4"
        type="text"
      />
    </span>
    <span class="ui-end-text" id="text-field-validation-4-end-text"
      >This code has expired.</span
    >
  </div>
</div>
