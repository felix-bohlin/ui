<div class="ui-textarea">
  <label class="ui-label" for="textarea-binding-1">Message</label>
  <span class="ui-field">
    <textarea id="textarea-binding-1" name="textarea-binding">
Thanks for the update.</textarea>
  </span>
</div>
<p class="textarea-binding-text">22 characters</p>
<button class="ui-button textarea-binding-reset" type="button">Reset</button>

<script type="module">
  const text = document.querySelector(".textarea-binding-text")
  const textarea = document.querySelector('[name="textarea-binding"]')

  function update() {
    if (!text || !textarea) return
    text.textContent = `${textarea.value.length} characters`
  }

  textarea?.addEventListener("input", update)
  document
    .querySelector(".textarea-binding-reset")
    ?.addEventListener("click", () => {
      if (textarea) textarea.value = textarea.defaultValue
      update()
    })
</script>
