<label class="ui-textarea">
  <span class="ui-label" id="textarea-end-text-1-label">Description</span>
  <span class="ui-field">
    <textarea
      placeholder="What is this project about?"
      aria-describedby="textarea-end-text-1-end-text"
      aria-labelledby="textarea-end-text-1-label"
    ></textarea>
  </span>
  <span class="ui-end-text" id="textarea-end-text-1-end-text"
    >Visible to everyone on the team.</span
  >
</label>
<label class="ui-textarea ui-filled">
  <span class="ui-label" id="textarea-end-text-2-label">Private notes</span>
  <span class="ui-field">
    <textarea
      placeholder="Add a note..."
      aria-describedby="textarea-end-text-2-end-text"
      aria-labelledby="textarea-end-text-2-label"
    ></textarea>
  </span>
  <span class="ui-end-text" id="textarea-end-text-2-end-text"
    >Only you can see these.</span
  >
</label>
