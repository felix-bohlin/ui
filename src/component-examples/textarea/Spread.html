<label class="ui-textarea ui-spread">
  <span class="ui-label">Message</span>
  <span class="ui-start-text">Keep it under 100 characters.</span>
  <span class="ui-field">
    <textarea placeholder="Hi, I have a question about my order."></textarea>
  </span>
</label>

<label class="ui-textarea ui-filled ui-spread">
  <span class="ui-label">Notes</span>
  <span class="ui-start-text">Add any additional notes or comments</span>
  <span class="ui-field">
    <textarea placeholder="Additional notes..."></textarea>
  </span>
  <span class="ui-end-text">Only your team sees these.</span>
</label>

<label class="ui-textarea ui-spread">
  <span class="ui-label">Reason for return</span>
  <span class="ui-start-text">Helps us improve our products</span>
  <span class="ui-field">
    <textarea required></textarea>
  </span>
</label>

<label class="ui-textarea ui-spread">
  <span class="ui-label">Order notes</span>
  <span class="ui-start-text">Orders can't change once they ship</span>
  <span class="ui-field">
    <textarea disabled></textarea>
  </span>
</label>

<label class="ui-textarea ui-spread">
  <span class="ui-label">Review</span>
  <span class="ui-start-text">Shown with your rating</span>
  <span class="ui-field">
    <textarea aria-invalid="true">Great</textarea>
  </span>
  <span class="ui-end-text">Write at least 20 characters.</span>
</label>

<label class="ui-textarea ui-spread">
  <span class="ui-label">Bio</span>
  <span class="ui-start-text">Shown on your public profile</span>
  <span class="ui-field">
    <textarea
      maxlength="280"
      placeholder="Tell us about yourself..."
    ></textarea>
    <span class="ui-start">
      <svg
        aria-hidden="true"
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path
          d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"
        ></path>
        <path
          d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"
        ></path>
      </svg>
    </span>
  </span>
  <span class="ui-end-text">
    <opui-character-count
      aria-hidden="true"
      class="ui-value"
    ></opui-character-count>
  </span>
</label>

<label class="ui-textarea ui-filled ui-spread">
  <span class="ui-label">Release notes</span>
  <span class="ui-start-text">Shown on the changelog page</span>
  <span class="ui-field">
    <textarea placeholder="Markdown supported..."></textarea>
    <span class="ui-top">v1.4.0</span>
    <span class="ui-bottom">Saved 2 minutes ago</span>
  </span>
  <span class="ui-end-text">Drafts save automatically.</span>
</label>

<script type="module">
  import "opui-css/elements/character-count.js"
</script>
