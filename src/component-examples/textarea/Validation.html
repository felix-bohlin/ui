<div class="example-row">
  <label class="ui-textarea">
    <span class="ui-label">Message</span>
    <span class="ui-field">
      <textarea placeholder="How can we help?" required></textarea>
    </span>
  </label>
  <label class="ui-textarea ui-filled">
    <span class="ui-label">Delivery instructions</span>
    <span class="ui-field">
      <textarea
        placeholder="Gate code, floor, where to leave it"
        required
      ></textarea>
    </span>
  </label>
</div>

<div class="example-row">
  <label class="ui-textarea">
    <span class="ui-label">Review</span>
    <span class="ui-field">
      <textarea aria-invalid="true">Great</textarea>
    </span>
    <span class="ui-end-text">Write at least 20 characters.</span>
  </label>
  <label class="ui-textarea ui-filled">
    <span class="ui-label">Bio</span>
    <span class="ui-field">
      <textarea aria-invalid="true">Designer at https://example.com</textarea>
    </span>
    <span class="ui-end-text">Remove the link. Bios are plain text.</span>
  </label>
</div>
