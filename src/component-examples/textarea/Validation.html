<div class="example-row">
  <div class="ui-textarea">
    <label class="ui-label" for="textarea-validation-1">Message</label>
    <span class="ui-field">
      <textarea
        placeholder="How can we help?"
        required
        id="textarea-validation-1"
      ></textarea>
    </span>
  </div>
  <div class="ui-textarea ui-filled">
    <label class="ui-label" for="textarea-validation-2"
      >Delivery instructions</label
    >
    <span class="ui-field">
      <textarea
        placeholder="Gate code, floor, where to leave it"
        required
        id="textarea-validation-2"
      ></textarea>
    </span>
  </div>
</div>

<div class="example-row">
  <div class="ui-textarea">
    <label class="ui-label" for="textarea-validation-3">Review</label>
    <span class="ui-field">
      <textarea
        aria-describedby="textarea-validation-3-end-text"
        aria-invalid="true"
        id="textarea-validation-3"
      >
Great</textarea>
    </span>
    <span class="ui-end-text" id="textarea-validation-3-end-text"
      >Write at least 20 characters.</span
    >
  </div>
  <div class="ui-textarea ui-filled">
    <label class="ui-label" for="textarea-validation-4">Bio</label>
    <span class="ui-field">
      <textarea
        aria-describedby="textarea-validation-4-end-text"
        aria-invalid="true"
        id="textarea-validation-4"
      >
Designer at https://example.com</textarea>
    </span>
    <span class="ui-end-text" id="textarea-validation-4-end-text"
      >Remove the link. Bios are plain text.</span
    >
  </div>
</div>
