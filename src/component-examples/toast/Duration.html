<button
  class="ui-button"
  commandfor="toaster"
  command="--show-toast"
  data-duration="1.5s"
  data-title="I disappear quickly"
>
  1.5s
</button>

<button
  class="ui-button"
  commandfor="toaster"
  command="--show-toast"
  data-duration="10s"
  data-title="I stay for a while"
>
  10s
</button>

<button
  class="ui-button"
  commandfor="toaster"
  command="--show-toast"
  data-persistent
  data-title="I stay until dismissed"
>
  Persistent
</button>
