<button class="ui-button" id="js-trigger-html">Trigger from JS</button>

<script>
  document.getElementById("js-trigger-html")?.addEventListener("click", () => {
    window.showToast({
      title: "Triggered from JS!",
      description: "With an optional description",
      severity: "success",
      duration: "3000ms",
    })
  })
</script>
