<button class="ui-button" id="js-trigger-html">Trigger from JS</button>

<script>
  function setupToastDemoHtml() {
    const btn = document.getElementById("js-trigger-html")
    if (btn) {
      btn.addEventListener("click", () => {
        if (window.showToast) {
          window.showToast({
            title: "Triggered from JS!",
            description: "With an optional description",
            severity: "success",
            duration: "3000ms",
          })
        }
      })
    }
  }

  setupToastDemoHtml()
</script>
