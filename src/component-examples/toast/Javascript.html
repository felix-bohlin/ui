<button class="ui-button" id="toast-js-demo">Save</button>

<script>
  function setupToastDemo() {
    const button = document.getElementById("toast-js-demo")
    button?.addEventListener("click", () => {
      const { dismiss, toast } = window.opui
      const saving = toast("Saving…", { persistent: true })
      setTimeout(() => {
        dismiss(saving)
        toast("Changes saved", { severity: "success" })
      }, 1500)
    })
  }

  setupToastDemo()
  document.addEventListener("astro:after-swap", setupToastDemo)
</script>
