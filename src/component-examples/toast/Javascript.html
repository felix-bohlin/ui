<button class="ui-button" id="toast-javascript-1">Trigger from JS</button>

<script>
  {
    const btn = document.getElementById("toast-javascript-1")
    if (btn) {
      btn.addEventListener("click", () => {
        if (window.showToast) {
          window.showToast({
            title: "Triggered from JS!",
            description: "With an optional description",
            severity: "success",
            duration: "3000ms",
          })
        }
      })
    }
  }
</script>
