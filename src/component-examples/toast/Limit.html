<button
  class="ui-button ui-outlined"
  type="button"
  command="--toast"
  commandfor="toast-limit-1"
  data-toast="Added to your cart"
  data-toast-severity="success"
>
  Add to cart
</button>
<opui-toaster id="toast-limit-1" limit="1" class="ui-toaster">
  <ol popover="manual"></ol>
  <div class="ui-sr-only" role="status"></div>
  <div class="ui-sr-only" role="alert"></div>
</opui-toaster>

<script type="module">
  import "opui-css/elements/toaster.js"
</script>
