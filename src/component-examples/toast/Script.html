<button class="ui-button ui-filled" type="button" id="toast-script-1-button">
  Save changes
</button>
<opui-toaster id="toast-script-1" class="ui-toaster">
  <ol popover="manual"></ol>
  <div class="ui-sr-only" role="status"></div>
  <div class="ui-sr-only" role="alert"></div>
</opui-toaster>

<script type="module">
  import { toast } from "opui-css/elements/toaster.js"

  document
    .getElementById("toast-script-1-button")
    ?.addEventListener("click", () => toast.success("Changes saved"))
</script>
