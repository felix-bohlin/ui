<button
  class="ui-button ui-filled"
  commandfor="toast-manager"
  command="--show-toast"
  data-title="Success!"
  data-severity="success"
>
  Success
</button>

<button
  class="ui-button ui-filled ui-critical"
  commandfor="toast-manager"
  command="--show-toast"
  data-title="Something went wrong"
  data-severity="critical"
>
  Error
</button>

<button
  class="ui-button ui-filled"
  commandfor="toast-manager"
  command="--show-toast"
  data-title="Did you know?"
  data-severity="info"
>
  Info
</button>
