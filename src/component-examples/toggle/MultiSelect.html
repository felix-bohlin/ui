<div class="ui-toggle-group" role="group">
  <label class="ui-toggle-button">
    <input name="text-style" type="checkbox" value="bold" aria-label="Bold" />
    <strong>B</strong>
  </label>
  <label class="ui-toggle-button">
    <input
      name="text-style"
      type="checkbox"
      value="italic"
      aria-label="Italic"
    />
    <i>I</i>
  </label>
  <label class="ui-toggle-button">
    <input
      name="text-style"
      type="checkbox"
      value="underline"
      aria-label="Underline"
    />
    <u>U</u>
  </label>
</div>
