<div role="group" class="ui-toggle-group">
  <label class="ui-toggle-button">
    <input type="checkbox" name="text-style" value="bold" aria-label="Bold" />
    <strong>B</strong>
  </label>
  <label class="ui-toggle-button">
    <input
      type="checkbox"
      name="text-style"
      value="italic"
      aria-label="Italic"
    />
    <i>I</i>
  </label>
  <label class="ui-toggle-button">
    <input
      type="checkbox"
      name="text-style"
      value="underline"
      aria-label="Underline"
    />
    <u>U</u>
  </label>
</div>
