<div style="display: grid; gap: var(--ui-space-4); max-inline-size: 14rem">
  <div style="display: grid; gap: var(--ui-space-1)">
    <p>Wrap</p>
    <div class="ui-toggle-group" role="radiogroup" aria-label="Notifications">
      <label class="ui-toggle-button">
        <input name="toggle-overflow-1" type="radio" value="all" />
        Everything
      </label>
      <label class="ui-toggle-button">
        <input name="toggle-overflow-1" type="radio" value="mentions" />
        Mentions
      </label>
      <label class="ui-toggle-button">
        <input name="toggle-overflow-1" type="radio" value="none" />
        Nothing at all
      </label>
    </div>
  </div>
  <div style="display: grid; gap: var(--ui-space-1)">
    <p>Scroll</p>
    <div
      class="ui-toggle-group ui-overflow-scroll"
      role="radiogroup"
      aria-label="Notifications"
    >
      <label class="ui-toggle-button">
        <input name="toggle-overflow-2" type="radio" value="all" />
        Everything
      </label>
      <label class="ui-toggle-button">
        <input name="toggle-overflow-2" type="radio" value="mentions" />
        Mentions
      </label>
      <label class="ui-toggle-button">
        <input name="toggle-overflow-2" type="radio" value="none" />
        Nothing at all
      </label>
    </div>
  </div>
  <div style="display: grid; gap: var(--ui-space-1)">
    <p>Shrink</p>
    <div
      class="ui-toggle-group ui-overflow-shrink"
      role="radiogroup"
      aria-label="Notifications"
    >
      <label class="ui-toggle-button">
        <input name="toggle-overflow-3" type="radio" value="all" />
        Everything
      </label>
      <label class="ui-toggle-button">
        <input name="toggle-overflow-3" type="radio" value="mentions" />
        Mentions
      </label>
      <label class="ui-toggle-button">
        <input name="toggle-overflow-3" type="radio" value="none" />
        Nothing at all
      </label>
    </div>
  </div>
</div>
