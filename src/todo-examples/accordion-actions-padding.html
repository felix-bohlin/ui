<style>
  .todo-compare {
    display: grid;
    gap: var(--size-4);
    grid-template-columns: repeat(auto-fit, minmax(18rem, 1fr));
    inline-size: 100%;
  }

  .todo-compare > div {
    display: grid;
    gap: var(--size-2);
    min-inline-size: 0;
  }

  .todo-proposed details.ui-accordion {
    --_actions-margin-block-start: 0;
    --_actions-padding-block-end: var(--_summary-padding-block);
    --_actions-padding-inline: var(--_padding-inline);
  }
</style>
<div class="todo-compare">
  <div>
    <p class="ui-caption">
      Current: actions padded <code>--size-3 --size-1</code>
    </p>
    <details open class="ui-accordion ui-card ui-marker-rotate ui-outlined">
      <summary>
        Connect your bank
        <svg
          class="ui-marker"
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
        >
          <path
            fill="currentColor"
            d="M4.293 8.293a1 1 0 0 1 1.414 0L12 14.586l6.293-6.293a1 1 0 1 1 1.414 1.414l-7 7a1 1 0 0 1-1.414 0l-7-7a1 1 0 0 1 0-1.414"
          />
        </svg>
      </summary>
      <div class="ui-content">
        <p>Link an account to import your transactions.</p>
      </div>
      <div class="ui-actions">
        <button type="button" class="ui-button ui-outlined">Skip</button>
        <button type="button" class="ui-button ui-filled">Connect</button>
      </div>
    </details>
  </div>
  <div class="todo-proposed">
    <p class="ui-caption">
      Proposed: actions use the content's inline padding and the summary's block
      padding
    </p>
    <details open class="ui-accordion ui-card ui-marker-rotate ui-outlined">
      <summary>
        Connect your bank
        <svg
          class="ui-marker"
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
        >
          <path
            fill="currentColor"
            d="M4.293 8.293a1 1 0 0 1 1.414 0L12 14.586l6.293-6.293a1 1 0 1 1 1.414 1.414l-7 7a1 1 0 0 1-1.414 0l-7-7a1 1 0 0 1 0-1.414"
          />
        </svg>
      </summary>
      <div class="ui-content">
        <p>Link an account to import your transactions.</p>
      </div>
      <div class="ui-actions">
        <button type="button" class="ui-button ui-outlined">Skip</button>
        <button type="button" class="ui-button ui-filled">Connect</button>
      </div>
    </details>
  </div>
</div>
