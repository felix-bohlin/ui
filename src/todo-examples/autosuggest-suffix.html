<style>
  .todo-autosuggest .ui-field:has(> .ui-suffix) {
    &::after {
      content: none;
    }

    input[list] {
      padding-inline-end: var(--_field-padding-inline);
    }
  }

  .todo-autosuggest .ui-suffix svg {
    block-size: 1em;
    inline-size: 1em;
    pointer-events: none;
  }
</style>
<p>
  An <code>svg</code> in the suffix replaces the CSS arrow. Type or press the
  down arrow key to open the list.
</p>
<div
  class="todo-autosuggest"
  style="display: grid; gap: var(--size-3); inline-size: 16rem"
>
  <label class="ui-text-field ui-small">
    <span class="ui-label">Small</span>
    <span class="ui-field">
      <input type="text" list="todo-suffix-users" placeholder="Placeholder" />
      <span class="ui-suffix" aria-hidden="true"
        ><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
          <path fill="currentColor" d="M7 10l5 5 5-5z" /></svg
      ></span>
    </span>
  </label>
  <label class="ui-text-field">
    <span class="ui-label">Default</span>
    <span class="ui-field">
      <input type="text" list="todo-suffix-users" placeholder="Placeholder" />
      <span class="ui-suffix" aria-hidden="true"
        ><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
          <path fill="currentColor" d="M7 10l5 5 5-5z" /></svg
      ></span>
    </span>
  </label>
  <label class="ui-text-field ui-large">
    <span class="ui-label">Large, chevron</span>
    <span class="ui-field">
      <input type="text" list="todo-suffix-users" placeholder="Placeholder" />
      <span class="ui-suffix" aria-hidden="true"
        ><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
          <path
            fill="currentColor"
            d="M6.3 8.3a1 1 0 0 1 1.4 0L12 12.6l4.3-4.3a1 1 0 1 1 1.4 1.4l-5 5a1 1 0 0 1-1.4 0l-5-5a1 1 0 0 1 0-1.4"
          /></svg
      ></span>
    </span>
  </label>
  <datalist id="todo-suffix-users">
    <option value="Ada Lovelace"></option>
    <option value="Alan Turing"></option>
    <option value="Grace Hopper"></option>
  </datalist>
</div>
