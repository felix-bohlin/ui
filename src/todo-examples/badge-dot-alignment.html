<style>
  .todo-badges {
    display: grid;
    gap: var(--size-4);
  }

  .todo-badges .todo-row {
    gap: var(--size-6);
  }

  .todo-badges figure {
    display: grid;
    gap: var(--size-2);
    justify-items: center;
    margin: 0;
  }

  .todo-badges .ui-badge > svg {
    outline: 1px dashed var(--border-color);
  }

  .todo-fixed .ui-badge {
    --_sx: -1;
    --_sy: 1;

    &.ui-start-start {
      --_sx: 1;
    }

    &.ui-end-start {
      --_sx: 1;
      --_sy: -1;
    }

    &.ui-end-end {
      --_sy: -1;
    }

    &.ui-dot {
      --_anchor-tx: calc((var(--_dot-size) - 2px) * var(--_sx));
      --_anchor-ty: calc(var(--_dot-size) * var(--_sy));
    }
  }
</style>
