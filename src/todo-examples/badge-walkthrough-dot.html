<style>
  .todo-rows {
    display: grid;
    gap: var(--size-4);
  }

  .todo-row {
    align-items: center;
    display: flex;
    flex-wrap: wrap;
    gap: var(--size-8);
  }

  .todo-badge {
    --dot: 0.5rem;
    --tx: -50%;
    --ty: 50%;

    display: inline-flex;
    position: relative;
    vertical-align: middle;

    &.start-start {
      --tx: 50%;
    }

    &.end-start {
      --tx: 50%;
      --ty: -50%;
    }

    &.end-end {
      --ty: -50%;
    }

    &.dot {
      --tx: calc((var(--dot) - 2px) * -1);
      --ty: var(--dot);
    }
  }

  .todo-indicator {
    background-color: var(--primary);
    block-size: var(--dot);
    border-radius: var(--radius-round);
    inline-size: var(--dot);
    inset-block: auto 100%;
    inset-inline: 100% auto;
    position: absolute;
    translate: var(--tx) var(--ty);

    :is(.start-start, .end-start) > & {
      inset-inline: auto 100%;
    }

    :is(.end-start, .end-end) > & {
      inset-block: 100% auto;
    }
  }
</style>
