<style>
  .todo-compare {
    display: grid;

  .todo-compare > div {
    display: grid;
    gap: var(--size-2);
    min-inline-size: 0;

    h2 {
      font-size: var(--font-size-3);
      margin: 0;
    }
  }

  .todo-current .ui-button:has(> svg:only-child) {
    margin-inline-start: auto;
  }

  .todo-proposed {
    gap: var(--size-1);

    h2 {
      flex: 1;
    }
  }
</style>
