<style>
  @layer components.extended {
    @scope (.todo-fixed) {
      :where(.ui-list).ui-bordered > :where(li + li)::before,
      :where(.ui-list) > .ui-border-top::before {
        border-block-start-color: color-mix(
          in oklch,
          currentColor 18%,
          transparent
        );
      }
    }
  }

  .todo-schemes {
    display: grid;
    gap: var(--size-3);
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 16rem), 1fr));
    inline-size: 100%;
  }

  .todo-scheme {
    border-radius: var(--border-radius);
    display: grid;
    gap: var(--size-2);
    padding: var(--size-3);
  }
</style>
<div class="todo-compare">
  <section class="todo-current">
    <p class="todo-label">Current: <code>--border-color</code></p>
    <div class="todo-schemes">
      <div class="todo-scheme ui-light">
        <ul class="ui-list ui-bordered ui-tonal" aria-label="Tonal, light">
          <li>
            <div class="ui-text"><p>Tonal</p></div>
          </li>
          <li>
            <div class="ui-text"><p>Light</p></div>
          </li>
          <li>
            <div class="ui-text"><p>Separator</p></div>
          </li>
        </ul>
        <ul class="ui-list ui-bordered" aria-label="Filled, light">
          <li>
            <div class="ui-text"><p>Filled</p></div>
          </li>
          <li>
            <div class="ui-text"><p>Light</p></div>
          </li>
        </ul>
      </div>
      <div class="todo-scheme ui-dark">
        <ul class="ui-list ui-bordered ui-tonal" aria-label="Tonal, dark">
          <li>
            <div class="ui-text"><p>Tonal</p></div>
          </li>
          <li>
            <div class="ui-text"><p>Dark</p></div>
          </li>
          <li>
            <div class="ui-text"><p>Separator</p></div>
          </li>
        </ul>
        <ul class="ui-list ui-bordered" aria-label="Filled, dark">
          <li>
            <div class="ui-text"><p>Filled</p></div>
          </li>
          <li>
            <div class="ui-text"><p>Dark</p></div>
          </li>
        </ul>
      </div>
    </div>
  </section>
  <section class="todo-fixed">
    <p class="todo-label">Proposed: 18% of the text color</p>
    <div class="todo-schemes">
      <div class="todo-scheme ui-light">
        <ul
          class="ui-list ui-bordered ui-tonal"
          aria-label="Tonal, light, proposed"
        >
          <li>
            <div class="ui-text"><p>Tonal</p></div>
          </li>
          <li>
            <div class="ui-text"><p>Light</p></div>
          </li>
          <li>
            <div class="ui-text"><p>Separator</p></div>
          </li>
        </ul>
        <ul class="ui-list ui-bordered" aria-label="Filled, light, proposed">
          <li>
            <div class="ui-text"><p>Filled</p></div>
          </li>
          <li>
            <div class="ui-text"><p>Light</p></div>
          </li>
        </ul>
      </div>
      <div class="todo-scheme ui-dark">
        <ul
          class="ui-list ui-bordered ui-tonal"
          aria-label="Tonal, dark, proposed"
        >
          <li>
            <div class="ui-text"><p>Tonal</p></div>
          </li>
          <li>
            <div class="ui-text"><p>Dark</p></div>
          </li>
          <li>
            <div class="ui-text"><p>Separator</p></div>
          </li>
        </ul>
        <ul class="ui-list ui-bordered" aria-label="Filled, dark, proposed">
          <li>
            <div class="ui-text"><p>Filled</p></div>
          </li>
          <li>
            <div class="ui-text"><p>Dark</p></div>
          </li>
        </ul>
      </div>
    </div>
  </section>
</div>
