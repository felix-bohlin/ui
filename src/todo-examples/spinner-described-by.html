<style>
  .todo-compare {
    display: grid;
    gap: var(--size-4);
    grid-template-columns: repeat(auto-fit, minmax(16rem, 1fr));
    inline-size: 100%;
  }

  .todo-compare > div {
    display: grid;
    gap: var(--size-2);
    min-inline-size: 0;
  }

  .todo-panel {
    border: 1px dashed var(--border-color);
    border-radius: var(--border-radius);
    display: grid;
    gap: var(--size-3);
    justify-items: start;
    padding: var(--size-3);
  }

  .todo-proposed :is(button, a)[aria-busy="true"][aria-describedby] {
    position: relative;

    &::before {
      animation: ui-spin
        max(0.7s * var(--motion, 1), 1.5s - 0.8s * var(--motion, 1)) linear
        infinite;
      block-size: 1em;
      border-color: transparent currentColor currentColor;
      border-radius: 50%;
      border-style: solid;
      border-width: 3px;
      content: "";
      display: inline-block;
      inline-size: 1em;
      opacity: 0.5;
      vertical-align: -0.14em;
    }
  }
</style>
<div class="todo-compare">
  <div>
    <p class="ui-caption">
      Current: <code>[aria-describedby]</code> skips everything described by
      anything
    </p>
    <div class="todo-panel">
      <button type="button" class="ui-button ui-filled" aria-busy="true">
        Save
      </button>
      <button
        type="button"
        class="ui-button ui-filled"
        aria-busy="true"
        aria-describedby="todo-hint-current"
      >
        Save
      </button>
      <span class="ui-caption" id="todo-hint-current"
        >Same button with a hint: no spinner.</span
      >
      <div aria-busy="true" aria-describedby="todo-progress-current">
        Results are loading.
      </div>
      <div class="ui-progress">
        <progress
          id="todo-progress-current"
          aria-label="Results loading"
        ></progress>
      </div>
    </div>
  </div>
  <div class="todo-proposed">
    <p class="ui-caption">
      Proposed: <code>[aria-describedby]:not(button, a)</code>
    </p>
    <div class="todo-panel">
      <button type="button" class="ui-button ui-filled" aria-busy="true">
        Save
      </button>
      <button
        type="button"
        class="ui-button ui-filled"
        aria-busy="true"
        aria-describedby="todo-hint-proposed"
      >
        Save
      </button>
      <span class="ui-caption" id="todo-hint-proposed"
        >Same button with a hint: spinner.</span
      >
      <div aria-busy="true" aria-describedby="todo-progress-proposed">
        Results are loading.
      </div>
      <div class="ui-progress">
        <progress
          id="todo-progress-proposed"
          aria-label="Results loading"
        ></progress>
      </div>
    </div>
  </div>
</div>
