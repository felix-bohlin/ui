<style>
  .todo-row {
    align-items: start;
    display: flex;
    flex-wrap: wrap;
    gap: var(--size-6);
  }

  .todo-row > div {
    display: grid;
    gap: var(--size-2);
    justify-items: start;
    max-inline-size: 16rem;
  }
</style>
<p>
  The walkthrough note says <code>:not(…)</code> skips "sections described by a
  progress bar". The selector skips anything with <code>aria-describedby</code>.
</p>
<div class="todo-row">
  <div>
    <p class="ui-caption">Busy button</p>
    <button aria-busy="true" class="ui-button ui-outlined" type="button">
      Saving
    </button>
  </div>
  <div>
    <p class="ui-caption">Busy button described by a hint: no spinner</p>
    <button
      aria-busy="true"
      aria-describedby="todo-spinner-hint"
      class="ui-button ui-outlined"
      type="button"
    >
      Saving
    </button>
    <p class="ui-caption" id="todo-spinner-hint">Saves to your account.</p>
  </div>
</div>
