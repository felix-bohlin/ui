<style>
  .todo-text-box {
    display: grid;
    gap: var(--size-3);
  }

  .todo-text-box .todo-trimmed > span {
    outline: 1px dashed currentColor;
    text-box: trim-both cap alphabetic;
  }

  .todo-text-box .todo-untrimmed > span {
    outline: 1px dashed currentColor;
  }

  .todo-text-box .todo-font {
    font-family: Georgia, "Times New Roman", serif;
  }
</style>
<div class="todo-text-box">
  <p>
    The dashed box is the label's box. Trimmed labels are centered on their
    capital letters.
  </p>
  <div class="todo-row">
    <button class="ui-button ui-outlined">Bare text</button>
    <button class="ui-button ui-outlined todo-untrimmed">
      <span>Wrapped</span>
    </button>
    <button class="ui-button ui-outlined todo-trimmed">
      <span>Wrapped, trimmed</span>
    </button>
  </div>
  <div class="todo-row todo-font">
    <button class="ui-button ui-outlined">Bare text</button>
    <button class="ui-button ui-outlined todo-untrimmed">
      <span>Wrapped</span>
    </button>
    <button class="ui-button ui-outlined todo-trimmed">
      <span>Wrapped, trimmed</span>
    </button>
  </div>
  <div class="todo-row">
    <span class="ui-chip">Bare chip</span>
    <span class="ui-chip todo-untrimmed"><span>Wrapped chip</span></span>
    <span class="ui-chip todo-trimmed"><span>Trimmed chip</span></span>
  </div>
  <p>
    Setting <code>text-box</code> on the button itself (first button in each
    row) does nothing, because the bare label is an anonymous flex item.
  </p>
</div>
