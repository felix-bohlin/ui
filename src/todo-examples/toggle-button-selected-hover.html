<p class="ui-caption">
  Hover "Selected": the primary tint turns into the faint neutral hover color.
</p>
<div class="ui-toggle-group" role="group" aria-label="Normal contrast">
  <label class="ui-toggle-button">
    <input type="checkbox" name="todo-toggle" value="selected" checked />
    Selected
  </label>
  <label class="ui-toggle-button">
    <input type="checkbox" name="todo-toggle" value="not-selected" />
    Not selected
  </label>
</div>
<div class="ui-contrast-more">
  <div class="ui-toggle-group" role="group" aria-label="Contrast more">
    <label class="ui-toggle-button">
      <input type="checkbox" name="todo-toggle-more" value="selected" checked />
      Selected, contrast more (hover: text disappears)
    </label>
  </div>
</div>
