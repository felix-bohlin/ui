<table class="ui-bar-chart ui-small" style="--max: 9">
  <caption>Small</caption>

    <tr>
      <th scope="col">Day</th>
      <th scope="col">Deploys</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <th scope="row">Mon</th>
      <td style="--value: 4" tabindex="0">4</td>
    </tr>
    <tr>
      <th scope="row">Tue</th>
      <td style="--value: 7" tabindex="0">7</td>
    </tr>
    <tr>

    </tr>
    <tr>

    </tr>
  </tbody>
</table>
