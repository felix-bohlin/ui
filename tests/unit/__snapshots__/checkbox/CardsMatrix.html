<form class="ui-form">
  <fieldset class="ui-fieldset">
    <legend>Add-ons</legend>
    <div class="ui-field-group ui-horizontal">
      <label class="ui-card ui-checkbox ui-spread">
        <input checked name="checkbox-cards-end" type="checkbox" value="support">
        <span class="ui-label">Priority support</span>
        <span class="ui-end-text">€8 per month</span>
      </label>
      <label class="ui-card ui-checkbox ui-elevated ui-spread">
        <input name="checkbox-cards-end" type="checkbox" value="storage">
        <span class="ui-label">Extra storage</span>
        <span class="ui-end-text">€4 per month</span>
      </label>
      <label class="ui-card ui-checkbox ui-spread ui-tonal">
        <input name="checkbox-cards-end" type="checkbox" value="audit-log">

        <span class="ui-end-text">€6 per month</span>
      </label>
    </div>
  </fieldset>
  <fieldset class="ui-fieldset">
    <legend>Email reports</legend>
    <div class="ui-field-group ui-horizontal">
      <label class="ui-card ui-checkbox">
        <input checked name="checkbox-cards-start" type="checkbox" value="weekly">
        <span class="ui-label">Weekly summary</span>
        <span class="ui-end-text">Every Monday morning.</span>
      </label>
      <label class="ui-card ui-checkbox ui-elevated">
        <input name="checkbox-cards-start" type="checkbox" value="usage">
        <span class="ui-label">Usage alerts</span>
        <span class="ui-end-text">At 80% of your plan.</span>
      </label>
      <label class="ui-card ui-checkbox ui-tonal">
        <input name="checkbox-cards-start" type="checkbox" value="invoices">
        <span class="ui-label">Invoices</span>
        <span class="ui-end-text">After each payment.</span>
      </label>
    </div>
  </fieldset>
