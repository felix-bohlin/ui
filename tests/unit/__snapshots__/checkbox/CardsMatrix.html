<form class="ui-form">
  <fieldset class="ui-fieldset">
    <legend>Input at the end</legend>
    <div class="ui-field-group ui-horizontal">
      <label class="ui-card ui-checkbox ui-spread">
        <input checked name="checkbox-cards-end" type="checkbox" value="outlined">
        <span class="ui-label">Outlined</span>
        <span class="ui-end-text">The default surface.</span>
      </label>
      <label class="ui-card ui-checkbox ui-spread ui-tonal">
        <input name="checkbox-cards-end" type="checkbox" value="tonal">
        <span class="ui-label">Tonal</span>
        <span class="ui-end-text">A tinted surface.</span>
      </label>
      <label class="ui-card ui-checkbox ui-elevated ui-spread">
        <input name="checkbox-cards-end" type="checkbox" value="elevated">
        <span class="ui-label">Elevated</span>
        <span class="ui-end-text">A raised surface.</span>
      </label>
    </div>
  </fieldset>
  <fieldset class="ui-fieldset">
    <legend>Input at the start</legend>
    <div class="ui-field-group ui-horizontal">
      <label class="ui-card ui-checkbox">
        <input checked name="checkbox-cards-start" type="checkbox" value="outlined">
        <span class="ui-label">Outlined</span>
        <span class="ui-end-text">The default surface.</span>
      </label>
      <label class="ui-card ui-checkbox ui-tonal">
        <input name="checkbox-cards-start" type="checkbox" value="tonal">
        <span class="ui-label">Tonal</span>
        <span class="ui-end-text">A tinted surface.</span>
      </label>
      <label class="ui-card ui-checkbox ui-elevated">
        <input name="checkbox-cards-start" type="checkbox" value="elevated">
        <span class="ui-label">Elevated</span>
        <span class="ui-end-text">A raised surface.</span>
      </label>
    </div>
  </fieldset>
</form>
