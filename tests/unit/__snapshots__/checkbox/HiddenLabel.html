<opui-select-all class="ui-select-all">
  <table class="ui-table">
    <thead>
      <tr>
        <th>
          <label class="ui-checkbox">
            <input data-select-all type="checkbox">
            <span class="ui-sr-only">Select all files</span>
          </label>
        </th>
        <th>File</th>
        <th>Size</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>
          <label class="ui-checkbox">
            <input checked name="checkbox-hidden-label" type="checkbox" value="invoice">
            <span class="ui-sr-only">Select Invoice.pdf</span>
          </label>
        </td>
        <td>Invoice.pdf</td>
        <td>120 kB</td>
      </tr>
      <tr>
        <td>
          <label class="ui-checkbox">
            <input name="checkbox-hidden-label" type="checkbox" value="logo">
            <span class="ui-sr-only">Select Logo.svg</span>
          </label>
        </td>
        <td>Logo.svg</td>
        <td>8 kB</td>
      </tr>
      <tr>
        <td>
          <label class="ui-checkbox">
            <input name="checkbox-hidden-label" type="checkbox" value="notes">
            <span class="ui-sr-only">Select Notes.md</span>
          </label>
        </td>
        <td>Notes.md</td>
        <td>2 kB</td>
      </tr>
    </tbody>
  </table>
</opui-select-all>
<p>
  Notify me by␣
  <label class="ui-checkbox">
    <input checked name="checkbox-hidden-label-notify" type="checkbox" value="email">
    <span class="ui-label">email</span>
  </label>
  ␣and␣
  <label class="ui-checkbox">
    <input name="checkbox-hidden-label-notify" type="checkbox" value="sms">
    <span class="ui-label">SMS</span>
  </label>
  .
</p>
