<opui-select-all class="ui-select-all">
  <fieldset class="ui-fieldset">
    <legend>Notifications</legend>
    <div class="ui-field-group">
      <label class="ui-checkbox">
        <input data-select-all type="checkbox">
        <span class="ui-label">All notifications</span>
      </label>
      <label class="ui-checkbox">
        <input checked name="checkbox-indeterminate" type="checkbox" value="email">
        <span class="ui-label">Email</span>
      </label>
      <label class="ui-checkbox">
        <input name="checkbox-indeterminate" type="checkbox" value="push">
        <span class="ui-label">Push</span>
      </label>
      <label class="ui-checkbox">
        <input name="checkbox-indeterminate" type="checkbox" value="sms">
        <span class="ui-label">SMS</span>
      </label>
    </div>
  </fieldset>
</opui-select-all>
