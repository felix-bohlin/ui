<label class="ui-checkbox ui-spread">
  <input name="checkbox-spread" type="checkbox" value="gift-wrap">
  <span class="ui-label">Gift wrap</span>
  <span class="ui-end-text">Wrapped in recycled paper for €3.</span>
</label>
<label class="ui-checkbox ui-spread">
  <input name="checkbox-spread" required type="checkbox" value="terms">
  <span class="ui-label">I accept the terms of sale</span>
  <span class="ui-end-text">Required to place the order.</span>
</label>
<label class="ui-checkbox ui-spread">
  <input disabled name="checkbox-spread" type="checkbox" value="express">
  <span class="ui-label">Express delivery</span>
  <span class="ui-end-text">Not available for your address.</span>
</label>
<label class="ui-checkbox ui-spread">
  <input aria-invalid="true" name="checkbox-spread" type="checkbox" value="age">
  <span class="ui-label">I'm 18 or older</span>
  <span class="ui-end-text">Confirm your age to buy this item.</span>
</label>
