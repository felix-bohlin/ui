<opui-color-field class="ui-color-field">
  <div class="ui-text-field">
    <label class="ui-label" for="id-2" id="id-1">Accent</label>
    <span class="ui-field">
      <span class="ui-start">
        <button aria-label="Pick a color" class="ui-button ui-round" command="toggle-popover" commandfor="id-3" type="button">
          <span class="ui-indicator"></span>
        </button>
      </span>
      <input autocomplete="off" id="id-2" spellcheck="false" type="text" value="oklch(0.62 0.19 260)">
    </span>
    <span class="ui-end-text">Paste any CSS color. It is saved as oklch().</span>
  </div>
  <div aria-labelledby="id-1" class="ui-floating" id="id-3" popover="auto" role="dialog">
    <label class="ui-range" for="id-5">
      <span class="ui-label" id="id-4">Lightness</span>
      <output aria-live="off" class="ui-value" for="id-5"></output>
      <input aria-labelledby="id-4" data-channel="L" id="id-5" max="1" min="0" step="0.001" type="range">
    </label>
    <label class="ui-range" for="id-7">
      <span class="ui-label" id="id-6">Chroma</span>
      <output aria-live="off" class="ui-value" for="id-7"></output>
      <input aria-describedby="id-10" aria-labelledby="id-6" data-channel="C" id="id-7" max="0.37" min="0" step="0.001" type="range">
    </label>
    <label class="ui-range" for="id-9">
      <span class="ui-label" id="id-8">Hue</span>
      <output aria-live="off" class="ui-value" for="id-9"></output>
      <input aria-labelledby="id-8" data-channel="H" id="id-9" max="360" min="0" step="0.1" type="range">
    </label>
    <p class="ui-description" id="id-10"></p>
  </div>
</opui-color-field>
