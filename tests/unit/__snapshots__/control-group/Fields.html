<div aria-label="Search orders" class="ui-control-group ui-filled ui-primary" role="group">
  <label class="ui-text-field">
    <span class="ui-sr-only">Search orders</span>
    <span class="ui-field">
      <input placeholder="Order number or customer" type="search">
    </span>
  </label>
  <button class="ui-button" type="button">Search</button>
</div>
<div aria-label="Price" class="ui-control-group" role="group">
  <label class="ui-select">
    <span class="ui-sr-only" id="id-1">Currency</span>
    <span class="ui-field">
      <select aria-labelledby="id-1" name="currency">
        <button>
          <selectedcontent></selectedcontent>
        </button>
        <div class="ui-list">
          <option value="eur">EUR</option>
          <option value="sek">SEK</option>
          <option value="usd">USD</option>
        </div>
      </select>
    </span>
  </label>
  <label class="ui-text-field">
    <span class="ui-sr-only">Amount</span>
    <span class="ui-field">
      <input inputmode="decimal" name="amount" placeholder="0.00" type="text">
    </span>
  </label>
</div>
