<div aria-label="Find an order" class="ui-control-group ui-filled ui-primary" role="group">
  <label class="ui-text-field">
    <span class="ui-sr-only" id="id-1">Order number or customer name</span>
    <span class="ui-field">
      <input aria-labelledby="id-1" placeholder="Search orders" type="search">
    </span>
  </label>
  <button class="ui-button" type="button">Search</button>
</div>
<fieldset class="ui-fieldset">
  <legend>Price</legend>
  <div class="ui-field-group">
    <div class="ui-control-group" role="group">
      <label class="ui-select">
        <span class="ui-sr-only" id="id-2">Currency</span>
        <span class="ui-field">
          <select aria-labelledby="id-2" name="currency">
            <button>
              <selectedcontent></selectedcontent>
            </button>
            <div class="ui-list">
              <option value="eur">EUR</option>
              <option value="sek">SEK</option>
              <option value="usd">USD</option>
            </div>
          </select>
        </span>
      </label>
      <label class="ui-text-field">
        <span class="ui-sr-only" id="id-3">Amount</span>
        <span class="ui-field">
          <input aria-labelledby="id-3" inputmode="decimal" name="amount" placeholder="0.00" type="text">
        </span>
      </label>
    </div>
  </div>
</fieldset>
<div aria-label="Add to cart" class="ui-control-group ui-filled ui-primary" role="group">
  <opui-number-field class="ui-number-field">
    <label class="ui-sr-only" for="id-4">Quantity</label>
    <span class="ui-field">
      <span class="ui-start">
        <button aria-controls="id-4" aria-label="Decrease" class="ui-button ui-round" command="--step-down" commandfor="id-4" type="button">
          <svg aria-hidden="true" height="24" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg">
            <path d="M19 13H5v-2h14z" fill="currentColor"></path>
          </svg>
        </button>
      </span>
      <input id="id-4" max="10" min="1" name="quantity" type="number" value="1">
      <span class="ui-end">
        <button aria-controls="id-4" aria-label="Increase" class="ui-button ui-round" command="--step-up" commandfor="id-4" type="button">
          <svg aria-hidden="true" height="24" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg">
            <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6z" fill="currentColor"></path>
          </svg>
        </button>
      </span>
    </span>
  </opui-number-field>
  <button class="ui-button" type="button">Add to cart</button>
</div>
