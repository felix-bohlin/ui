<div aria-label="Find a bassist" class="ui-control-group ui-filled ui-primary" role="group">
  <div class="ui-field">
    <label class="ui-sr-only" for="id-1">Bassist name or handle</label>
    <span class="ui-field-container">
      <input id="id-1" placeholder="Search bassists" type="search">
    </span>
  </div>
  <button class="ui-button" type="button">Search</button>
</div>
<fieldset class="ui-fieldset">
  <legend>Price</legend>
  <div class="ui-field-group">
    <div class="ui-control-group" role="group">
      <div class="ui-field">
        <label class="ui-sr-only" for="id-2">Currency</label>
        <span class="ui-field-container">
          <select id="id-2" name="currency">
            <button>
              <selectedcontent></selectedcontent>
            </button>
            <option value="eur">EUR</option>
            <option value="sek">SEK</option>
            <option value="usd">USD</option>
          </select>
        </span>
      </div>
      <div class="ui-field">
        <label class="ui-sr-only" for="id-3">Amount</label>
        <span class="ui-field-container">
          <input id="id-3" inputmode="decimal" name="amount" placeholder="0.00">
        </span>
      </div>
    </div>
  </div>
</fieldset>
<div aria-label="Add to cart" class="ui-control-group ui-filled ui-primary" role="group">
  <div class="ui-auto-fit ui-field">
    <label class="ui-sr-only" for="id-5">Quantity</label>
    <span class="ui-field-container">
      <span class="ui-start" id="id-4">
        <opui-step-button>
          <button aria-controls="id-5" aria-label="Decrease" class="ui-button ui-round" command="--step-down" commandfor="id-5" type="button">
            <svg aria-hidden="true" height="24" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"></svg>
          </button>
        </opui-step-button>
      </span>
      <input id="id-5" max="10" min="1" name="quantity" type="number" value="1">
      <span class="ui-end" id="id-6">
        <opui-step-button>
          <button aria-controls="id-5" aria-label="Increase" class="ui-button ui-round" command="--step-up" commandfor="id-5" type="button">
            <svg aria-hidden="true" height="24" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"></svg>
          </button>
        </opui-step-button>
      </span>
    </span>
  </div>
  <button class="ui-button" type="button">Add to cart</button>
</div>
