<opui-file-upload class="ui-file-upload">
  <div class="ui-content">
    <div class="ui-field-container">
      <label class="ui-label">
        <input accept="image/*" aria-describedby="id-2" class="ui-sr-only" id="id-1" multiple type="file">
        <span class="ui-button ui-outlined">Choose photos</span>
        <svg aria-hidden="true" height="24" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"></svg>
      </label>
      <span class="ui-description" id="id-2">Or drop them here. PNG or JPG.</span>
    </div>
    <ul class="ui-list">
      <li>
        <div class="ui-start">
          <img alt src="/photos/lou-headstock.png">
        </div>
        <div class="ui-text">
          <p dir="auto" id="id-3">lou-headstock.png</p>
        </div>
        <div class="ui-end">
          <button aria-label="Remove lou-headstock.png" class="ui-button ui-round ui-small" command="--remove" commandfor="id-1" type="button" value="lou">
            <svg aria-hidden="true" height="32" viewBox="0 0 32 32" width="32" xmlns="http://www.w3.org/2000/svg"></svg>
          </button>
        </div>
      </li>
      <li>
        <div class="ui-start">
          <img alt src="/photos/percy-groove.png">
        </div>
        <div class="ui-text">
          <p dir="auto" id="id-4">percy-groove.png</p>
          <div class="ui-progress">
            <progress aria-label="Uploading percy-groove.png" value="0.6"></progress>
          </div>
        </div>
        <div class="ui-end">
          <button aria-label="Remove percy-groove.png" class="ui-button ui-round ui-small" command="--remove" commandfor="id-1" type="button" value="percy">
            <svg aria-hidden="true" height="32" viewBox="0 0 32 32" width="32" xmlns="http://www.w3.org/2000/svg"></svg>
          </button>
        </div>
      </li>
      <li>
        <div class="ui-start"></div>
        <div class="ui-text">
          <p dir="auto" id="id-5">holly-humbucker.png</p>
          <div class="ui-progress">
            <progress aria-label="Uploading holly-humbucker.png"></progress>
          </div>
          <p class="ui-description" id="id-6">Waiting for its turn</p>
        </div>
        <div class="ui-end">
          <button aria-label="Remove holly-humbucker.png" class="ui-button ui-round ui-small" command="--remove" commandfor="id-1" type="button" value="holly">
            <svg aria-hidden="true" height="32" viewBox="0 0 32 32" width="32" xmlns="http://www.w3.org/2000/svg"></svg>
          </button>
        </div>
      </li>
    </ul>
  </div>
  <span class="ui-sr-only" role="status"></span>
</opui-file-upload>
