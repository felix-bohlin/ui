<form class="ui-form">

        <span class="ui-label" id="id-2">Name</span>
        <span class="ui-field">
          <input aria-labelledby="id-2" autocomplete="name" type="text">
        </span>
      </label>
      <label class="ui-text-field">
        <span class="ui-label" id="id-3">Email</span>
        <span class="ui-field">
          <input aria-labelledby="id-3" autocomplete="email" type="email">
        </span>
      </label>
    </div>
  </fieldset>
  <div class="ui-field-group">
    <button class="ui-button ui-filled" type="submit">Send</button>
  </div>
</form>
