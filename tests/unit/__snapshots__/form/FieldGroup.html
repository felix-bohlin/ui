<form class="ui-form">
  <fieldset class="ui-fieldset">
    <legend>Choose your favorite Radiohead album</legend>
    <p class="ui-field-description">There are no wrong answers.</p>
    <div class="ui-field-group" role="group">
      <label class="ui-radio">
        <input name="albums" type="radio" value="ok-computer">
        <span class="ui-label">OK Computer</span>
      </label>
      <label class="ui-radio">
        <input name="albums" type="radio" value="kid-a">
        <span class="ui-label">Kid A</span>
      </label>
      <label class="ui-radio">
        <input name="albums" type="radio" value="in-rainbows">
        <span class="ui-label">In Rainbows</span>
      </label>
      <label class="ui-radio">
        <input name="albums" type="radio" value="king-of-limbs">
        <span class="ui-label">The King of Limbs</span>
      </label>
    </div>
  </fieldset>
  <fieldset class="ui-fieldset">
    <legend>Which side projects do you follow?</legend>
    <p class="ui-field-description">Some are better than others.</p>
    <div class="ui-field-group" role="group">
      <label class="ui-checkbox">
        <input aria-describedby="id-1" name="projects" type="checkbox" value="the-smile">
        <span class="ui-label">The Smile</span>
        <span class="ui-end-text" id="id-1">Thom Yorke, Jonny Greenwood, Tom Skinner</span>
      </label>
      <label class="ui-checkbox">
        <input aria-describedby="id-2" name="projects" type="checkbox" value="atoms-for-peace">
        <span class="ui-label">Atoms for Peace</span>
        <span class="ui-end-text" id="id-2">Thom Yorke, Flea, Nigel Godrich</span>
      </label>
      <label class="ui-checkbox">
        <input aria-describedby="id-3" name="projects" type="checkbox" value="eob">
        <span class="ui-label">EOB</span>
        <span class="ui-end-text" id="id-3">Ed O'Brien solo</span>
      </label>
      <label class="ui-checkbox">
        <input aria-describedby="id-4" name="projects" type="checkbox" value="jonny-scores">
        <span class="ui-label">Film Scores</span>
        <span class="ui-end-text" id="id-4">Film compositions by Jonny Greenwood</span>
      </label>
      <label class="ui-checkbox">
        <input aria-describedby="id-5" name="projects" type="checkbox" value="selway-solo">
        <span class="ui-label">Philip Selway</span>
        <span class="ui-end-text" id="id-5">Philip Selway solo albums</span>
      </label>
    </div>
  </fieldset>
</form>
