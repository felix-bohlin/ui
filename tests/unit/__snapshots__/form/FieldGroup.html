<form class="ui-form">
  <fieldset class="ui-fieldset">
    <legend>Plan</legend>
    <p class="ui-description">You can change your plan at any time.</p>
    <div class="ui-field-group">
      <label class="ui-radio">
        <input name="plan" type="radio" value="starter">
        <span class="ui-label">Starter</span>
      </label>
      <label class="ui-radio">
        <input name="plan" type="radio" value="team">
        <span class="ui-label">Team</span>
      </label>
      <label class="ui-radio">
        <input name="plan" type="radio" value="business">
        <span class="ui-label">Business</span>
      </label>
    </div>
  </fieldset>
  <fieldset class="ui-fieldset">
    <legend>Add-ons</legend>
    <p class="ui-description">Billed monthly with your plan.</p>
    <div class="ui-field-group">
      <label class="ui-checkbox">
        <input name="add-ons" type="checkbox" value="backups">
        <span class="ui-label">Backups</span>
        <span class="ui-end-text">Daily snapshots, kept for 30 days.</span>
      </label>
      <label class="ui-checkbox">
        <input name="add-ons" type="checkbox" value="encryption">
        <span class="ui-label">Encryption</span>
        <span class="ui-end-text">Encrypt your files with your own keys.</span>
      </label>
      <label class="ui-checkbox">
        <input name="add-ons" type="checkbox" value="single-sign-on">
        <span class="ui-label">Single sign-on</span>
        <span class="ui-end-text">Sign in with your company account.</span>
      </label>
    </div>
  </fieldset>
</form>
