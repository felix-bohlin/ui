<form class="ui-form" id="id-1">
  <fieldset aria-describedby="id-2" class="ui-fieldset">
    <legend>User profile</legend>
    <p class="ui-description" id="id-2">Please provide your basic contact details.</p>
    <div class="ui-field-group">
      <div class="ui-text-field">
        <label class="ui-label" for="id-3">Full name</label>
        <span class="ui-field">
          <input autocomplete="name" id="id-3" placeholder="Hakki Hälinen" required type="text">
        </span>
      </div>
      <div class="ui-text-field">
        <label class="ui-label" for="id-4">Email address</label>
        <span class="ui-field">
          <input autocomplete="email" id="id-4" placeholder="name@example.com" required type="email">
        </span>
      </div>
      <div class="ui-select">
        <label class="ui-label" for="id-5">Role</label>
        <span class="ui-field">
          <select id="id-5">
            <button>
              <selectedcontent></selectedcontent>
            </button>
            <div class="ui-list">
              <option value="design">Designer</option>
              <option value="dev">Developer</option>
              <option value="manager">Manager</option>
            </div>
          </select>
        </span>
      </div>
    </div>
  </fieldset>
  <hr class="ui-divider">
  <fieldset aria-describedby="id-6" class="ui-fieldset">
    <legend>Notifications</legend>
    <p class="ui-description" id="id-6">Configure how you want to receive updates.</p>
    <div class="ui-field-group">
      <label class="ui-switch">
        <input checked name="email_notifs" role="switch" type="checkbox">
        <span class="ui-label">Email notifications</span>
      </label>
      <label class="ui-switch">
        <input name="sms_notifs" role="switch" type="checkbox">
        <span class="ui-label">SMS notifications</span>
      </label>
    </div>
  </fieldset>
  <hr class="ui-divider">
  <fieldset aria-describedby="id-7" class="ui-fieldset">
    <legend>Theme preference</legend>
    <p class="ui-description" id="id-7">Select your preferred visual style.</p>
    <div class="ui-field-group">
      <label class="ui-radio">
        <input checked name="theme" type="radio" value="light">
        <span class="ui-label">Light theme</span>
      </label>
      <label class="ui-radio">
        <input name="theme" type="radio" value="dark">
        <span class="ui-label">Dark theme</span>
      </label>
      <label class="ui-radio">
        <input name="theme" type="radio" value="system">
        <span class="ui-label">System default</span>
      </label>
    </div>
  </fieldset>
  <hr class="ui-divider">
  <fieldset aria-describedby="id-8" class="ui-fieldset">
    <legend>Experience level</legend>
    <p class="ui-description" id="id-8">How many years of experience do you have?</p>
    <div class="ui-field-group">
      <label class="ui-range">
        <span class="ui-label" id="id-9">Professional experience</span>
        <span class="ui-start-text" id="id-10">Drag the slider to match your total tenure.</span>
        <input aria-describedby="id-10" aria-labelledby="id-9" max="20" min="0" step="1" type="range" value="5">
      </label>
    </div>
  </fieldset>
  <hr class="ui-divider">
  <fieldset aria-describedby="id-11" class="ui-fieldset">
    <legend>Additional info</legend>
    <p class="ui-description" id="id-11">Anything else we should know?</p>
    <div class="ui-field-group">
      <div class="ui-textarea">
        <label class="ui-label" for="id-12">Biography</label>
        <span class="ui-field">
          <textarea id="id-12" name="biography" placeholder="Tell us about yourself..." rows="4"></textarea>
        </span>
      </div>
    </div>
  </fieldset>
  <hr class="ui-divider">
  <fieldset class="ui-fieldset">
    <legend>Legal</legend>
    <div class="ui-field-group">
      <label class="ui-checkbox">
        <input name="terms" required type="checkbox">
        <span class="ui-label">I agree to the terms and conditions</span>
        <span class="ui-end-text">You can withdraw your consent at any time.</span>
      </label>
    </div>
  </fieldset>
  <hr class="ui-divider">
  <div class="ui-field-group">
    <button class="ui-button" type="button">Cancel</button>
    <button class="ui-button ui-filled" type="submit">Send</button>
  </div>
</form>
