<form class="ui-form" id="id-1">
  <fieldset class="ui-fieldset">
    <legend>User Profile</legend>
    <p class="ui-field-description">Please provide your basic contact details.</p>
    <div class="ui-field-group" role="group">
      <label class="ui-spread ui-text-field">
        <span class="ui-label">Full Name</span>
        <span class="ui-field">
          <input placeholder="Jane Doe" required type="text">
        </span>
      </label>
      <label class="ui-spread ui-text-field">
        <span class="ui-label">Email Address</span>
        <span class="ui-field">
          <input placeholder="jane@example.com" required type="email">
        </span>
      </label>
      <label class="ui-select ui-spread">
        <span class="ui-label" id="id-2">Role</span>
        <span class="ui-field">
          <select aria-labelledby="id-2">
            <option value="dev">Developer</option>
            <option value="design">Designer</option>
            <option value="manager">Manager</option>
          </select>
        </span>
      </label>
    </div>
  </fieldset>
  <hr class="ui-divider">
  <fieldset class="ui-fieldset">
    <legend>Notifications</legend>
    <p class="ui-field-description">Configure how you want to receive updates.</p>
    <div class="ui-field-group" role="group">
      <label class="ui-spread ui-switch">
        <input checked name="email_notifs" role="switch" type="checkbox">
        <span class="ui-label">Email Notifications</span>
      </label>
      <label class="ui-spread ui-switch">
        <input name="sms_notifs" role="switch" type="checkbox">
        <span class="ui-label">SMS Notifications</span>
      </label>
    </div>
  </fieldset>
  <hr class="ui-divider">
  <fieldset class="ui-fieldset">
    <legend>Theme Preference</legend>
    <p class="ui-field-description">Select your preferred visual style.</p>
    <div class="ui-field-group ui-row" role="group">
      <label class="ui-radio">
        <input checked name="theme" type="radio" value="light">
        <span class="ui-label">Light Theme</span>
      </label>
      <label class="ui-radio">
        <input name="theme" type="radio" value="dark">
        <span class="ui-label">Dark Theme</span>
      </label>
      <label class="ui-radio">
        <input name="theme" type="radio" value="system">
        <span class="ui-label">System Default</span>
      </label>
    </div>
  </fieldset>
  <hr class="ui-divider">
  <fieldset class="ui-fieldset">
    <legend>Experience Level</legend>
    <p class="ui-field-description">How many years of experience do you have?</p>
    <div class="ui-field-group" role="group">
      <label class="ui-range ui-spread">
        <span class="ui-label" id="id-3">Professional Experience</span>
        <span class="ui-start-text" id="id-4">Drag the slider to match your total tenure.</span>
        <input aria-describedby="id-4" aria-labelledby="id-3" max="20" min="0" step="1" type="range" value="5">
      </label>
    </div>
  </fieldset>
  <hr class="ui-divider">
  <fieldset class="ui-fieldset">
    <legend>Additional Info</legend>
    <p class="ui-field-description">Anything else we should know?</p>
    <div class="ui-field-group" role="group">
      <label class="ui-spread ui-textarea">
        <span class="ui-label">Biography</span>
        <span class="ui-field">
          <textarea name="details" placeholder="Tell us about yourself..." rows="4"></textarea>
        </span>
      </label>
    </div>
  </fieldset>
  <hr class="ui-divider">
  <fieldset class="ui-fieldset">
    <legend>Legal</legend>
    <div class="ui-field-group" role="group">
      <label class="ui-checkbox ui-spread">
        <input aria-describedby="id-5" name="terms" required type="checkbox">
        <span class="ui-label">I agree to the terms and conditions</span>
        <span class="ui-end-text" id="id-5">Support this text</span>
      </label>
    </div>
  </fieldset>
  <hr class="ui-divider">
  <div class="ui-field-group" role="group">
    <button class="ui-button ui-filled" type="submit">Send</button>
    <button class="ui-button" type="button">Cancel</button>
  </div>
</form>
