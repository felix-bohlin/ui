<fieldset class="ui-fieldset">
  <legend>Theme</legend>
  <div class="ui-field-group">
    <ul class="ui-list" role="list">
      <li>
        <label class="ui-radio">
          <div class="ui-text">
            <p>Dark mode</p>
          </div>
          <div class="ui-end">
            <input name="theme" type="radio" value="dark">
          </div>
        </label>
      </li>
      <li>
        <label class="ui-radio">
          <div class="ui-text">
            <p>Light mode</p>
          </div>
          <div class="ui-end">
            <input name="theme" type="radio" value="light">
          </div>
        </label>
      </li>
    </ul>
  </div>
</fieldset>
