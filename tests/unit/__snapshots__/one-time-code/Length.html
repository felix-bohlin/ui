<label class="ui-one-time-code ui-text-field">
  <span class="ui-label">PIN</span>
  <span class="ui-field">
    <input autocomplete="one-time-code" inputmode="numeric" maxlength="4" name="pin" pattern="[0-9]{4}" type="text">
  </span>
</label>
<label class="ui-grouped ui-one-time-code ui-text-field">
  <span class="ui-label">Backup code</span>
  <span class="ui-field">
    <input autocomplete="one-time-code" inputmode="numeric" maxlength="8" name="backup-code" pattern="[0-9]{8}" type="text">
  </span>
</label>
