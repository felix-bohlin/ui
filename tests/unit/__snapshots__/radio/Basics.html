<form class="ui-form">
  <fieldset class="ui-fieldset">
    <legend>Payment method</legend>
    <div class="ui-field-group">
      <label class="ui-radio">
        <input checked name="radio-group" type="radio" value="card">
        <span class="ui-label">Card</span>
      </label>
      <label class="ui-radio">
        <input name="radio-group" type="radio" value="paypal">
        <span class="ui-label">PayPal</span>
      </label>
      <label class="ui-radio">
        <input name="radio-group" type="radio" value="bank-transfer">
        <span class="ui-label">Bank transfer</span>
      </label>
    </div>
  </fieldset>
</form>
