<form class="ui-form">
  <fieldset class="ui-fieldset">
    <legend>Plan</legend>
    <div class="ui-field-group ui-horizontal">
      <label class="ui-card ui-radio ui-spread">
        <input checked name="radio-cards-end" type="radio" value="starter">
        <span class="ui-label">Starter</span>
        <span class="ui-end-text">€0 per month</span>
      </label>
      <label class="ui-card ui-elevated ui-radio ui-spread">
        <input name="radio-cards-end" type="radio" value="team">
        <span class="ui-label">Team</span>
        <span class="ui-end-text">€12 per person per month</span>
      </label>
      <label class="ui-card ui-radio ui-spread ui-tonal">
        <input name="radio-cards-end" type="radio" value="business">
        <span class="ui-label">Business</span>
        <span class="ui-end-text">€24 per person per month</span>
      </label>
    </div>
  </fieldset>
  <fieldset class="ui-fieldset">
    <legend>Billing</legend>
    <div class="ui-field-group ui-horizontal">
      <label class="ui-card ui-radio">
        <input checked name="radio-cards-start" type="radio" value="monthly">
        <span class="ui-label">Monthly</span>
        <span class="ui-end-text">Cancel at any time.</span>
      </label>
      <label class="ui-card ui-elevated ui-radio">
        <input name="radio-cards-start" type="radio" value="yearly">
        <span class="ui-label">Yearly</span>
        <span class="ui-end-text">Two months free.</span>
      </label>
      <label class="ui-card ui-radio ui-tonal">
        <input name="radio-cards-start" type="radio" value="invoice">
        <span class="ui-label">Invoice</span>
        <span class="ui-end-text">Pay by bank transfer.</span>
      </label>
    </div>
  </fieldset>
</form>
