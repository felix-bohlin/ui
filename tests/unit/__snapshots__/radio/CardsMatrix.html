<form class="ui-form">
  <fieldset class="ui-fieldset">
    <legend>Plan</legend>
    <div class="ui-field-group ui-horizontal">
      <label class="ui-card ui-radio ui-spread">
        <input checked name="radio-cards-end" type="radio" value="basic">
        <span class="ui-label">Basic</span>
        <span class="ui-end-text">€0 per month, forever</span>
      </label>
      <label class="ui-card ui-elevated ui-radio ui-spread">
        <input name="radio-cards-end" type="radio" value="gold">
        <span class="ui-label">Gold</span>
        <span class="ui-end-text">€3 per month, shiny badge included</span>
      </label>
      <label class="ui-card ui-radio ui-spread ui-tonal">
        <input name="radio-cards-end" type="radio" value="platinum">
        <span class="ui-label">Platinum</span>
        <span class="ui-end-text">€5 per month, extra sparkly</span>
      </label>
    </div>
  </fieldset>
  <fieldset class="ui-fieldset">
    <legend>Billing</legend>
    <div class="ui-field-group ui-horizontal">
      <label class="ui-card ui-radio">
        <input checked name="radio-cards-start" type="radio" value="monthly">
        <span class="ui-label">Monthly</span>
        <span class="ui-end-text">Cancel any time, no hard feelings.</span>
      </label>
      <label class="ui-card ui-elevated ui-radio">
        <input name="radio-cards-start" type="radio" value="yearly">
        <span class="ui-label">Yearly</span>
        <span class="ui-end-text">Two months free, woohoo.</span>
      </label>
      <label class="ui-card ui-radio ui-tonal">
        <input name="radio-cards-start" type="radio" value="gig-money">
        <span class="ui-label">Gig money</span>
        <span class="ui-end-text">Pay in coins after your next gig.</span>
      </label>
    </div>
  </fieldset>
</form>
