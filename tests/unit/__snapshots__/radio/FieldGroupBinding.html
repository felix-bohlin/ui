<fieldset class="ui-fieldset">
  <legend>Plan</legend>
  <div class="ui-field-group">
    <label class="ui-radio">
      <input checked name="radio-binding" type="radio" value="basic">
      <span class="ui-label">Basic</span>
    </label>
    <label class="ui-radio">
      <input name="radio-binding" type="radio" value="gold">
      <span class="ui-label">Gold</span>
    </label>
    <label class="ui-radio">
      <input name="radio-binding" type="radio" value="platinum">
      <span class="ui-label">Platinum</span>
    </label>
  </div>
</fieldset>
<p class="radio-binding-text">Selected: basic</p>
<button class="radio-binding-reset ui-button" type="button">Reset</button>
