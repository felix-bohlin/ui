<form class="ui-form">
  <fieldset class="ui-fieldset" disabled>
    <legend>Billing cycle</legend>
    <div class="ui-field-group ui-horizontal">
      <label class="ui-radio">
        <input checked name="radio-group-disabled" type="radio" value="monthly">
        <span class="ui-label">Monthly</span>
      </label>
      <label class="ui-radio">
        <input name="radio-group-disabled" type="radio" value="quarterly">
        <span class="ui-label">Quarterly</span>
      </label>
      <label class="ui-radio">
        <input name="radio-group-disabled" type="radio" value="yearly">
        <span class="ui-label">Yearly</span>
      </label>
    </div>
  </fieldset>
  <fieldset class="ui-fieldset">
    <legend>Delivery</legend>
    <div class="ui-field-group ui-horizontal">
      <label class="ui-radio">
        <input checked name="radio-group-disabled-single" type="radio" value="standard">
        <span class="ui-label">Standard</span>
      </label>
      <label class="ui-radio">
        <input disabled name="radio-group-disabled-single" type="radio" value="same-day">
        <span class="ui-label">Same day</span>
      </label>
    </div>
  </fieldset>
</form>
