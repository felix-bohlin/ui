<form class="ui-form">
  <fieldset class="ui-fieldset">
    <legend>Delivery</legend>
    <div class="ui-field-group">
      <label class="ui-radio ui-spread">
        <input aria-describedby="id-1" checked name="radio-spread" type="radio" value="standard">
        <span class="ui-label">Standard</span>
        <span class="ui-end-text" id="id-1">Arrives in 3 to 5 days.</span>
      </label>
      <label class="ui-radio ui-spread">
        <input aria-describedby="id-2" name="radio-spread" type="radio" value="express">
        <span class="ui-label">Express</span>
        <span class="ui-end-text" id="id-2">Arrives tomorrow.</span>
      </label>
      <label class="ui-radio ui-spread">
        <input aria-describedby="id-3" disabled name="radio-spread" type="radio" value="pickup">
        <span class="ui-label">Pickup</span>
        <span class="ui-end-text" id="id-3">Not available in your area.</span>
      </label>
    </div>
  </fieldset>
</form>
