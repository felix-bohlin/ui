<label class="ui-range">
  <span class="ui-label" id="id-1">Tick marks with labels</span>
  <input aria-labelledby="id-1" list="id-2" type="range">
  <datalist id="id-2">
    <option label="0%" value="0"></option>
    <option label="25%" value="25"></option>
    <option label="50%" value="50"></option>
    <option label="75%" value="75"></option>
    <option label="100%" value="100"></option>
  </datalist>
</label>
<label class="ui-range">
  <span class="ui-label" id="id-3">Quality</span>
  <input aria-labelledby="id-3" list="id-4" max="2" type="range">
  <datalist id="id-4">
    <option label="Low" value="0"></option>
    <option label="Medium" value="1"></option>
    <option label="High" value="2"></option>
  </datalist>
</label>
