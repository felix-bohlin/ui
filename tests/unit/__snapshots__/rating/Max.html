<meter aria-label="Rated 2 out of 3" class="ui-rating" max="3" style="--_max: 3" value="2"></meter>
<meter aria-label="Rated 7.5 out of 10" class="ui-rating" max="10" style="--_max: 10" value="7.5"></meter>
<fieldset class="ui-rating">
  <legend>Difficulty</legend>
  <input aria-label="No rating" name="difficulty" type="radio" value="0">
  <input aria-label="1 star" name="difficulty" type="radio" value="1">
  <input aria-label="2 stars" checked name="difficulty" type="radio" value="2">
  <input aria-label="3 stars" name="difficulty" type="radio" value="3">
</fieldset>
