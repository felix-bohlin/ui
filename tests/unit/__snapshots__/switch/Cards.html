        <input checked name="switch-cards" role="switch" type="checkbox" value="email">
        <span class="ui-label">Email</span>
        <span class="ui-end-text">A summary of each day.</span>
      </label>
      <label class="ui-card ui-spread ui-switch">
        <input name="switch-cards" role="switch" type="checkbox" value="push">
        <span class="ui-label">Push</span>
        <span class="ui-end-text">Right when something happens.</span>
      </label>
      <label class="ui-card ui-spread ui-switch">
        <input name="switch-cards" role="switch" type="checkbox" value="digest">

      </label>
    </div>
