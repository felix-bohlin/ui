<form class="ui-form">
  <fieldset class="ui-fieldset">
    <legend>Input at the end</legend>
    <div class="ui-field-group ui-horizontal">
      <label class="ui-card ui-spread ui-switch">
        <input checked name="switch-cards-end" role="switch" type="checkbox" value="outlined">
        <span class="ui-label">Outlined</span>
        <span class="ui-end-text">The default surface.</span>
      </label>
      <label class="ui-card ui-spread ui-switch ui-tonal">
        <input name="switch-cards-end" role="switch" type="checkbox" value="tonal">
        <span class="ui-label">Tonal</span>
        <span class="ui-end-text">A tinted surface.</span>
      </label>
      <label class="ui-card ui-elevated ui-spread ui-switch">
        <input name="switch-cards-end" role="switch" type="checkbox" value="elevated">
        <span class="ui-label">Elevated</span>
        <span class="ui-end-text">A raised surface.</span>
      </label>
    </div>
  </fieldset>
  <fieldset class="ui-fieldset">
    <legend>Input at the start</legend>
    <div class="ui-field-group ui-horizontal">
      <label class="ui-card ui-switch">
        <input checked name="switch-cards-start" role="switch" type="checkbox" value="outlined">
        <span class="ui-label">Outlined</span>
        <span class="ui-end-text">The default surface.</span>
      </label>
      <label class="ui-card ui-switch ui-tonal">
        <input name="switch-cards-start" role="switch" type="checkbox" value="tonal">
        <span class="ui-label">Tonal</span>
        <span class="ui-end-text">A tinted surface.</span>
      </label>
      <label class="ui-card ui-elevated ui-switch">
        <input name="switch-cards-start" role="switch" type="checkbox" value="elevated">
        <span class="ui-label">Elevated</span>
        <span class="ui-end-text">A raised surface.</span>
      </label>
    </div>
  </fieldset>
</form>
