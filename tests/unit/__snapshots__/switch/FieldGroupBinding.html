<fieldset class="ui-fieldset">
  <legend>Notifications</legend>
  <div class="ui-field-group">
    <label class="ui-switch">
      <input checked name="switch-binding" role="switch" type="checkbox" value="email">
      <span class="ui-label">Email</span>
    </label>
    <label class="ui-switch">
      <input name="switch-binding" role="switch" type="checkbox" value="push">
      <span class="ui-label">Push</span>
    </label>
    <label class="ui-switch">
      <input name="switch-binding" role="switch" type="checkbox" value="sms">
      <span class="ui-label">SMS</span>
    </label>
  </div>
</fieldset>
<p class="switch-binding-text">Selected: email</p>
<button class="switch-binding-reset ui-button" type="button">Reset</button>
