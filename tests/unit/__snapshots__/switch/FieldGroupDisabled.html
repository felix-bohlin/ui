<form class="ui-form">
  <fieldset class="ui-fieldset" disabled>
    <legend>Share with friends</legend>
    <div class="ui-field-group ui-horizontal">
      <label class="ui-switch">
        <input name="switch-group-disabled" role="switch" type="checkbox" value="profile">
        <span class="ui-label">Profile</span>
      </label>
      <label class="ui-switch">
        <input name="switch-group-disabled" role="switch" type="checkbox" value="activity">
        <span class="ui-label">Activity</span>
      </label>
      <label class="ui-switch">
        <input name="switch-group-disabled" role="switch" type="checkbox" value="location">
        <span class="ui-label">Location</span>
      </label>
    </div>
  </fieldset>
  <fieldset class="ui-fieldset">
    <legend>Sync</legend>
    <div class="ui-field-group ui-horizontal">

        <input checked name="switch-group-disabled-single" role="switch" type="checkbox" value="contacts">

      </label>
      <label class="ui-switch">
        <input disabled name="switch-group-disabled-single" role="switch" type="checkbox" value="photos">

      </label>
    </div>
