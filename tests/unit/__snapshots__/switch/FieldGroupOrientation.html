<form class="ui-form">
  <fieldset class="ui-fieldset">
    <legend>Show in toolbar</legend>
    <div class="ui-field-group ui-horizontal">
      <label class="ui-switch">
        <input name="switch-group-orientation" role="switch" type="checkbox" value="bold">
        <span class="ui-label">Bold</span>
      </label>
      <label class="ui-switch">
        <input name="switch-group-orientation" role="switch" type="checkbox" value="italic">
        <span class="ui-label">Italic</span>
      </label>
      <label class="ui-switch">
        <input name="switch-group-orientation" role="switch" type="checkbox" value="underline">
        <span class="ui-label">Underline</span>
      </label>
    </div>
  </fieldset>
</form>
