<label class="ui-spread ui-switch">
  <input name="switch-spread" role="switch" type="checkbox" value="notifications">
  <span class="ui-label">Notifications</span>
  <span class="ui-end-text">Receive alerts when someone mentions you.</span>
</label>
<label class="ui-spread ui-switch">
  <input name="switch-spread" required role="switch" type="checkbox" value="two-step-login">
  <span class="ui-label">Two-step login</span>
  <span class="ui-end-text">Your organization requires it for admins.</span>
</label>
<label class="ui-spread ui-switch">
  <input disabled name="switch-spread" role="switch" type="checkbox" value="location">
  <span class="ui-label">Location access</span>
  <span class="ui-end-text">Turned off by your administrator.</span>
</label>
<label class="ui-spread ui-switch">
  <input aria-invalid="true" name="switch-spread" role="switch" type="checkbox" value="backup">
  <span class="ui-label">Cloud backup</span>
  <span class="ui-end-text">Sync needs cloud backup. Turn it on to continue.</span>
</label>
