<opui-text-field class="ui-text-field">
  <label class="ui-label" for="id-1">Password</label>
  <span class="ui-field">
    <input autocomplete="current-password" id="id-1" type="password">
    <span class="ui-end">
      <button aria-label="Show password" aria-pressed="false" class="ui-button ui-round" command="--toggle-password" commandfor="id-1" type="button">
        <svg aria-hidden="true" class="ui-icon-unchecked" height="24" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"></svg>
        <svg aria-hidden="true" class="ui-icon-checked" height="24" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"></svg>
      </button>
    </span>
  </span>
</opui-text-field>
<opui-text-field class="ui-text-field">
  <label class="ui-label" for="id-2">New password</label>
  <span class="ui-field">
    <input aria-describedby="id-3" autocomplete="new-password" id="id-2" minlength="12" type="password">
    <span class="ui-end">
      <button aria-label="Show password" aria-pressed="false" class="ui-button ui-round" command="--toggle-password" commandfor="id-2" type="button">
        <svg aria-hidden="true" class="ui-icon-unchecked" height="24" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"></svg>
        <svg aria-hidden="true" class="ui-icon-checked" height="24" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"></svg>
      </button>
    </span>
  </span>
  <span class="ui-end-text" id="id-3">At least 12 characters.</span>
</opui-text-field>
