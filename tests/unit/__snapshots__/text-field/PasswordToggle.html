<div class="ui-field">
  <label class="ui-label" for="id-1">Password</label>
  <span class="ui-field-container">
    <input autocomplete="current-password" id="id-1" type="password">
    <span class="ui-end" id="id-2">
      <opui-password-toggle>
        <button aria-label="Show password" aria-pressed="false" class="ui-button ui-round" command="--toggle-password" commandfor="id-1" type="button">
          <svg aria-hidden="true" class="ui-icon-unchecked" height="24" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"></svg>
          <svg aria-hidden="true" class="ui-icon-checked" height="24" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"></svg>
        </button>
      </opui-password-toggle>
    </span>
  </span>
</div>
<div class="ui-field">
  <label class="ui-label" for="id-3">New password</label>
  <span class="ui-field-container">
    <input aria-describedby="id-5" autocomplete="new-password" id="id-3" minlength="12" type="password">
    <span class="ui-end" id="id-4">
      <opui-password-toggle>
        <button aria-label="Show new password" aria-pressed="false" class="ui-button ui-round" command="--toggle-password" commandfor="id-3" type="button">
          <svg aria-hidden="true" class="ui-icon-unchecked" height="24" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"></svg>
          <svg aria-hidden="true" class="ui-icon-checked" height="24" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"></svg>
        </button>
      </opui-password-toggle>
    </span>
  </span>
  <span class="ui-end-text" id="id-5">At least 12 characters.</span>
</div>
