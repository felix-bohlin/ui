<button class="ui-button ui-outlined" command="show-modal" commandfor="id-1" type="button">Edit profile</button>
<dialog aria-labelledby="id-2" class="ui-dialog ui-elevated" id="id-1">
  <div class="ui-header">
    <h2 id="id-2">Profile</h2>
    <button aria-label="Close" class="ui-button ui-round ui-small" command="close" commandfor="id-1" type="button">
      <svg aria-hidden="true" height="32" viewBox="0 0 32 32" width="32" xmlns="http://www.w3.org/2000/svg"></svg>
    </button>
  </div>
  <div class="ui-content">
    <p>Your name and photo are shown next to your posts.</p>
  </div>
  <div class="ui-footer">
    <button class="ui-button ui-filled" command="--toast" commandfor="id-3" data-toast="Profile saved" data-toast-severity="success" type="button">Save</button>
  </div>
  <opui-toaster class="ui-toaster" id="id-3">
    <ol popover="manual"></ol>
    <div class="ui-sr-only" role="status"></div>
    <div class="ui-sr-only" role="alert"></div>
  </opui-toaster>
</dialog>
