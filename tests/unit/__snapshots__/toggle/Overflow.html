<div style="display: grid; gap: var(--size-4); max-inline-size: 14rem">
  <div style="display: grid; gap: var(--size-1)">
    <p>Wrap</p>
    <div class="ui-toggle-group" role="group">
      <label class="ui-toggle-button">
        <input name="overflow-wrap" type="checkbox" value="all">
        Everything
      </label>
      <label class="ui-toggle-button">
        <input name="overflow-wrap" type="checkbox" value="mentions">
        Mentions
      </label>
      <label class="ui-toggle-button">
        <input name="overflow-wrap" type="checkbox" value="none">
        Nothing at all
      </label>
    </div>
  </div>
  <div style="display: grid; gap: var(--size-1)">
    <p>Scroll</p>
    <div class="ui-scrollable ui-toggle-group" role="group">
      <label class="ui-toggle-button">
        <input name="overflow-scrollable" type="checkbox" value="all">
        Everything
      </label>
      <label class="ui-toggle-button">
        <input name="overflow-scrollable" type="checkbox" value="mentions">
        Mentions
      </label>
      <label class="ui-toggle-button">
        <input name="overflow-scrollable" type="checkbox" value="none">
        Nothing at all
      </label>
    </div>
  </div>
  <div style="display: grid; gap: var(--size-1)">
    <p>Shrink</p>
    <div class="ui-shrink ui-toggle-group" role="group">
      <label class="ui-toggle-button">
        <input name="overflow-shrink" type="checkbox" value="all">
        Everything
      </label>
      <label class="ui-toggle-button">
        <input name="overflow-shrink" type="checkbox" value="mentions">
        Mentions
      </label>
      <label class="ui-toggle-button">
        <input name="overflow-shrink" type="checkbox" value="none">
        Nothing at all
      </label>
    </div>
  </div>
</div>
