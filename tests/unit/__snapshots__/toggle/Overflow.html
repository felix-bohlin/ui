<div style="display: grid; gap: var(--ui-space-4); max-inline-size: 14rem">
  <div style="display: grid; gap: var(--ui-space-1)">
    <p>Wrap</p>
    <div aria-label="Notifications" class="ui-toggle-group" role="radiogroup">
      <label class="ui-toggle-button">
        <input name="overflow-wrap" type="radio" value="all">
        Everything
      </label>
      <label class="ui-toggle-button">
        <input name="overflow-wrap" type="radio" value="mentions">
        Mentions
      </label>
      <label class="ui-toggle-button">
        <input name="overflow-wrap" type="radio" value="none">
        Nothing at all
      </label>
    </div>
  </div>
  <div style="display: grid; gap: var(--ui-space-1)">
    <p>Scroll</p>
    <div aria-label="Notifications" class="ui-overflow-scroll ui-toggle-group" role="radiogroup">
      <label class="ui-toggle-button">
        <input name="overflow-scroll" type="radio" value="all">
        Everything
      </label>
      <label class="ui-toggle-button">
        <input name="overflow-scroll" type="radio" value="mentions">
        Mentions
      </label>
      <label class="ui-toggle-button">
        <input name="overflow-scroll" type="radio" value="none">
        Nothing at all
      </label>
    </div>
  </div>
  <div style="display: grid; gap: var(--ui-space-1)">
    <p>Shrink</p>
    <div aria-label="Notifications" class="ui-overflow-shrink ui-toggle-group" role="radiogroup">
      <label class="ui-toggle-button">
        <input name="overflow-shrink" type="radio" value="all">
        ␣Everything
      </label>
      <label class="ui-toggle-button">
        <input name="overflow-shrink" type="radio" value="mentions">
        ␣Mentions
      </label>
      <label class="ui-toggle-button">
        <input name="overflow-shrink" type="radio" value="none">
        ␣Nothing at all
      </label>
    </div>
  </div>
</div>
