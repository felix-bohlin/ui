<div class="tooltip-alignment-grid">
  <span class="ui-anchor ui-tooltip" style="--anchor-position-area: block-start">
    <span interestfor="id-1">
      <button class="ui-button" command="toggle-popover" commandfor="id-1" interestfor="id-1">Top</button>
    </span>
    <span class="ui-anchor-floating" id="id-1" popover="hint">Above</span>
  </span>
  <span class="ui-anchor ui-tooltip" style="--anchor-position-area: inline-start">
    <span interestfor="id-2">
      <button class="ui-button" command="toggle-popover" commandfor="id-2" interestfor="id-2">Start</button>
    </span>
    <span class="ui-anchor-floating" id="id-2" popover="hint">Before</span>
  </span>
  <span class="ui-anchor ui-tooltip" style="--anchor-position-area: inline-end">
    <span interestfor="id-3">
      <button class="ui-button" command="toggle-popover" commandfor="id-3" interestfor="id-3">End</button>
    </span>
    <span class="ui-anchor-floating" id="id-3" popover="hint">After</span>
  </span>
  <span class="ui-anchor ui-tooltip" style="--anchor-position-area: block-end">
    <span interestfor="id-4">
      <button class="ui-button" command="toggle-popover" commandfor="id-4" interestfor="id-4">Bottom</button>
    </span>
    <span class="ui-anchor-floating" id="id-4" popover="hint">Below</span>
  </span>
</div>
